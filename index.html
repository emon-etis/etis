<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F26522">
<meta name="mobile-web-app-capable" content="yes">
<title>ETIS / KHUCHU04</title>
<style>
:root{
  --brand:#F26522;--brand-d:#c94f14;--brand-l:#fff2ea;
  --ink:#1b2232;--muted:#6b7385;--line:#e6e9ef;--bg:#f4f6fa;--card:#fff;
  --good:#16a34a;--good-l:#e7f6ec;--warn:#d98a00;--warn-l:#fff5df;--bad:#dc2626;--bad-l:#fdecec;
  --blue:#2563eb;--blue-l:#eaf1ff;--na:#9aa3b2;--wa:#128c4a;--wa-l:#e5f6ec;
  --r:16px;--sh:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg{width:100%;height:100%;display:block}
.hidden{display:none!important}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(circle at 15% 10%,#ffe3d1 0,transparent 40%),radial-gradient(circle at 90% 90%,#e3ecff 0,transparent 45%),var(--bg)}
.lcard{width:100%;max-width:400px;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(16,24,40,.12);padding:32px 26px 24px}
.logo{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--brand),#ff9a4d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;box-shadow:0 8px 20px rgba(242,101,34,.35);margin-bottom:18px}
.lcard h1{font-size:26px;letter-spacing:-.5px}
.lcard h1 span{color:var(--brand)}
.lsub{color:var(--muted);font-size:13.5px;margin:4px 0 24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.inwrap{position:relative;display:flex;align-items:center}
.inwrap .ic{position:absolute;left:13px;width:18px;height:18px;color:var(--na)}
.inwrap input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 44px 0 42px;font-size:16px;background:#fafbfc;outline:none}
.inwrap input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(242,101,34,.12)}
.eye{position:absolute;right:8px;width:34px;height:34px;padding:7px;color:var(--muted);border-radius:8px}
.btn{height:50px;border-radius:12px;font-weight:700;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 8px 18px rgba(242,101,34,.3)}
.btn-p:active{transform:scale(.98);background:var(--brand-d)}
.lerr{color:var(--bad);font-size:13.5px;min-height:20px;margin:2px 0 8px;font-weight:600}
.demo{margin-top:18px;background:var(--blue-l);color:#1e3a8a;border-radius:12px;padding:10px 14px;font-size:13px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* SHELL */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;height:60px;display:flex;align-items:center;gap:8px;padding:0 10px}
.tb-btn{width:40px;height:40px;border-radius:12px;padding:9px;flex:none}
.tb-btn:hover{background:var(--bg)}
.tb-brand{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#ff9a4d);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-left:4px}
.tb-t{flex:1;min-width:0}
.tb-t b{display:block;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-t small{display:block;color:var(--muted);font-size:12px;margin-top:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:12px;color:var(--good);font-weight:600;opacity:0;transition:opacity .3s;white-space:nowrap}
.saved.on{opacity:1}
.tb-ic{width:38px;height:38px;border-radius:10px;padding:9px;color:var(--muted);border:1px solid var(--line);background:#fff;flex:none}
.logout{color:var(--bad);border-color:#f5d0d0}
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px 56px}

/* CARDS & COMMON */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid #eef0f4;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mt{margin-top:14px}
.sec-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;margin:24px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{border-radius:20px;padding:22px 20px;color:#fff;background:linear-gradient(130deg,#F26522 0%,#ff8a3d 55%,#ffb070 100%);display:flex;justify-content:space-between;align-items:center;gap:14px;position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(242,101,34,.25)}
.hero:after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero>div{position:relative;z-index:1;min-width:0}
.hero-k{font-size:13.5px;opacity:.92}
.hero h1{font-size:23px;letter-spacing:-.4px;margin:2px 0}
.hero-s{font-size:13px;opacity:.9}
.score{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:10px 14px;text-align:center;min-width:100px}
.score b{display:block;font-size:24px;line-height:1.1}
.score small{font-size:11px;opacity:.95;text-transform:uppercase;letter-spacing:.4px}
.navcard{display:block;text-align:left;width:100%;cursor:pointer;transition:transform .15s,box-shadow .15s}
.navcard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(16,24,40,.1)}
.nc-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.nc-h>div{min-width:0}
.icotile{width:48px;height:48px;border-radius:14px;padding:12px;flex:none}
.it-o{background:var(--brand-l);color:var(--brand)}.it-b{background:var(--blue-l);color:var(--blue)}.it-g{background:var(--good-l);color:var(--good)}.it-p{background:#f3e8ff;color:#7c3aed}.it-y{background:var(--warn-l);color:var(--warn)}
.nc-h h2{font-size:18px;letter-spacing:-.3px}
.nc-h p{font-size:13px;color:var(--muted)}
.nc-go{margin-left:auto;width:30px;height:30px;padding:6px;border-radius:50%;background:var(--bg);color:var(--muted);flex:none}
.mini{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13.5px}
.mini span:first-child{width:96px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .bar{flex:1}
.mini b{width:58px;text-align:right}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tstat{background:var(--bg);border-radius:12px;padding:10px;min-width:0}
.tstat small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.tstat b{font-size:16px;word-break:break-word}
.bar{height:8px;border-radius:99px;background:#edf0f5;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.b-good{background:var(--good)}.b-warn{background:var(--warn)}.b-bad{background:var(--bad)}.b-na{background:var(--na)}.b-brand{background:var(--brand)}.b-grey{background:#a8b0bf}
.s-good{color:var(--good)}.s-warn{color:var(--warn)}.s-bad{color:var(--bad)}.s-na{color:var(--na)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-good{background:var(--good-l);color:#166534}.p-warn{background:var(--warn-l);color:#8a5600}.p-bad{background:var(--bad-l);color:#991b1b}.p-na{background:#eef0f4;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:5px 10px;border-radius:99px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.c-good{background:var(--good-l);color:#166534}.c-bad{background:var(--bad-l);color:#991b1b}.c-warn{background:var(--warn-l);color:#8a5600}.c-blue{background:var(--blue-l);color:#1e40af}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h3{font-size:16.5px}
.btn-s{height:38px;padding:0 13px;border-radius:10px;background:var(--brand-l);color:var(--brand-d);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-s i{width:16px;height:16px;display:block}
.btn-o{min-height:46px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;text-align:center}
.btn-o i{width:18px;height:18px;display:block;flex:none}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-danger{color:var(--bad);border-color:#f3c6c6}
.btn-blue{color:var(--blue);border-color:#c9d8fb}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions>*{flex:1 1 200px}
.icbtn{width:40px;height:40px;border-radius:10px;padding:10px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.icbtn.call{background:var(--blue-l);color:var(--blue)}
.icbtn.wa{background:var(--wa-l);color:var(--wa)}
.icbtn.del{background:var(--bad-l);color:var(--bad)}
.cbox{display:inline-flex;gap:6px}
.cbox:empty{display:none}
.notice{background:var(--warn-l);border:1px solid #f3dca4;color:#6e4500;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:13.5px}
.notice .sp{flex:1 1 220px}
.notice button{font-weight:700;font-size:13px;padding:7px 12px;border-radius:9px;background:#fff;border:1px solid #f3dca4}
.addcard{border:2px dashed #d3d9e3;border-radius:var(--r);display:flex;align-items:center;justify-content:center;gap:8px;min-height:110px;color:var(--brand);font-weight:700;background:transparent;width:100%}
.addcard i{width:22px;height:22px;display:block}
.addcard:hover{background:#fffaf6;border-color:var(--brand)}
.badge-now{font-size:11px;font-weight:800;background:var(--brand);color:#fff;border-radius:99px;padding:2px 8px;text-transform:uppercase;letter-spacing:.4px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mhead b{font-size:17px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 6px;gap:8px}
.mrow .big{font-size:24px;font-weight:800;letter-spacing:-.5px}
.kcard{position:relative}
.kdel{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:9px;padding:8px;color:var(--na)}
.kdel:hover{background:var(--bad-l);color:var(--bad)}
.msel{height:42px;border:1.5px solid var(--line);border-radius:11px;padding:0 10px;background:#fff;font-weight:600;max-width:100%}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:14px;border:1px solid #eef0f4;box-shadow:var(--sh);position:relative;overflow:hidden;min-width:0}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--brand))}
.stat small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.stat b{display:block;font-size:22px;letter-spacing:-.5px;margin-top:2px;word-break:break-word}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.overall .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.overall .bar{height:12px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(16,24,40,.1)}

/* KPI TABLE */
table.rso{width:100%;border-collapse:separate;border-spacing:0}
table.rso th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);background:#fafbfc}
table.rso td{padding:8px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
.cell{width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px;background:#fff;outline:none;min-width:0}
.cell:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(242,101,34,.12)}
.cell.n{max-width:130px;text-align:right;font-variant-numeric:tabular-nums}
.namec{display:flex;align-items:center;gap:8px}
.nlink{text-align:left;min-width:0}
.nlink b{display:block;font-size:14.5px}
.nlink small{display:block;font-size:11.5px;color:var(--muted)}
.nlink:hover b{color:var(--brand)}
.rank{width:28px;height:28px;border-radius:8px;background:var(--bg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.rank.r1{background:#fff3c4;color:#92400e}
.gapv{font-weight:700}
.ahead{color:var(--good);font-weight:700;font-size:13.5px}
.pcell{min-width:120px}
.pcell .pv{font-weight:800;font-size:14.5px;margin-bottom:5px}

/* LIST ROWS */
.trow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:8px;cursor:pointer;transition:.15s}
.trow:hover{border-color:var(--brand);background:#fffaf6}
.trow .tn{flex:1;min-width:0}
.trow .tn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.trow .tn small{display:block;color:var(--muted);font-size:12px}
.trow .tn .bar{height:6px;margin-top:6px}
.trow .tr{text-align:right;font-weight:700;font-size:14.5px;white-space:nowrap}
.trow .tr small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.trow .go{width:20px;height:20px;color:var(--na);flex:none}
.empty{color:var(--muted);font-size:13.5px;padding:14px;text-align:center;background:var(--bg);border-radius:12px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;border-radius:9px;font-weight:800;font-size:14px}
.bA{background:var(--good-l);color:var(--good)}.bB{background:var(--warn-l);color:var(--warn)}
.catcol h3{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:10px}
.rule{font-size:13.5px;color:var(--muted);background:#fff;border:1px dashed #d8dde6;border-radius:12px;padding:10px 12px;margin:14px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rule input{width:130px;height:38px}

/* FIELDS */
.frow{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f2f6}
.frow:last-child{border-bottom:0}
.flbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;word-break:break-word}
.fin{display:flex;gap:6px;align-items:center;min-width:0}
.fin .cell{flex:1}
.phead{display:flex;gap:14px;align-items:center}
.avatar{width:58px;height:58px;border-radius:16px;background:var(--brand-l);color:var(--brand);font-weight:800;font-size:23px;display:flex;align-items:center;justify-content:center;flex:none}
.phead small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.phead h2{font-size:21px;letter-spacing:-.3px;word-break:break-word}
.rsorow{display:grid;grid-template-columns:34px 1.2fr 1fr auto 26px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f2f6}
.rsorow:last-child{border:0}
.rsorow .go{width:24px;height:24px;padding:3px;color:var(--na);border-radius:6px}
.rsorow label{display:block;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kv div{background:#fff;border:1px solid #eef0f4;border-radius:14px;padding:12px;text-align:center;box-shadow:var(--sh);min-width:0}
.kv small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.3px}
.kv b{font-size:18px;word-break:break-word}
.detail-hero{text-align:center;padding:24px 18px}
.detail-hero .badge{font-size:22px;height:54px;min-width:54px;border-radius:16px;margin-bottom:10px}
.detail-hero h2{font-size:21px;word-break:break-word}
.detail-hero .rev{font-size:30px;font-weight:800;color:var(--brand);margin-top:4px}
.kline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid #f0f2f6;align-items:center}
.kline:last-child{border:0}
.kline .bar{grid-column:1/-1}
.kline small{color:var(--muted);font-size:12.5px}
.hist{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;padding:7px 0}
.hist b{text-align:right}
.msbar{display:grid;grid-template-columns:100px 1fr 56px;gap:10px;align-items:center;margin:8px 0}
.msbar .bar{height:14px}
.msbar b{text-align:right}
textarea.cell{height:110px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;font-size:12.5px;color:var(--muted)}

/* SHEET + TOAST */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh-back{position:absolute;inset:0;background:rgba(15,20,30,.45)}
.sh-card{position:relative;background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-h b{font-size:18px}
.sh-f{display:block;margin-bottom:12px}
.sh-f span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.sh-f input,.sh-f select{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:#fff;outline:none}
.sh-f input:focus,.sh-f select:focus{border-color:var(--brand)}
.sh-err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px;font-weight:600}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1b2232;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:600px){#sheet{align-items:center}.sh-card{border-radius:20px}}

/* SYNC */
.sync{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;background:#eef0f4;color:var(--muted)}
.sync.live{background:var(--good-l);color:#166534}
.sync.ro{background:var(--blue-l);color:#1e40af}
.sync.off{background:var(--warn-l);color:#8a5600}
.lmode{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px}
.linkbtn{color:var(--brand-d);font-weight:700;font-size:13px;text-decoration:underline;display:block;margin:12px auto 0}
.btn:disabled{opacity:.6}

/* ================= CALCULATIONS ================= */

function calc(t,a){t=num(t);a=num(a);return {t:t,a:a,gap:t-a,pct:t>0?(a/t)*100:null};}
function rowOf(kp,rid){return kp.rows[rid]||{t:0,a:0};}
function grp(g){return g==='bp'?(data.bps||[]):data.rsos;}
function gLbl(g){return g==='bp'?'BP':'RSO';}
function memberById(id){
  var i=data.rsos.findIndex(function(x){return x.id===id;});if(i>=0)return {m:data.rsos[i],g:'rso',i:i};
  i=(data.bps||[]).findIndex(function(x){return x.id===id;});if(i>=0)return {m:data.bps[i],g:'bp',i:i};
  return null;
}
function mtdDay(k){
  var cur=curKey();if(k<cur)return 30;if(k>cur)return 0;
  var M=data.months[k],d=M&&num(M.mtdDay)?num(M.mtdDay):Math.max(1,new Date().getDate()-1);
  return Math.min(30,Math.max(1,Math.round(d)));
}
function mtd(t,a,k){
  var d=mtdDay(k);t=num(t);a=num(a);
  if(!d)return {proj:null,pct:null,d:0};
  var proj=a/d*30;return {proj:proj,pct:t>0?proj/t*100:null,d:d};
}
function mtdHtml(t,a,k){
  var m=mtd(t,a,k);
  return '<div class="pcell"><div class="pv s-'+status(m.pct)+'">'+pctTxt(m.pct)+'</div><small class="muted num">'+(m.proj==null?'—':'→ '+fmt(m.proj)+' by month end')+'</small></div>';
}
function partSum(kp,g){var T=0,A=0;grp(g).forEach(function(r){var x=rowOf(kp,r.id);T+=num(x.t);A+=num(x.a);});return calc(T,A);}
function kpiSum(kp){var a=partSum(kp,'rso');if(!kp.bp)return a;var b=partSum(kp,'bp');return calc(a.t+b.t,a.a+b.a);}

function monthScore(m){var ps=m.kpis.map(function(k){return kpiSum(k).pct;}).filter(function(p){return p!=null;});return ps.length?avg(ps):null;}
function monthMtd(m,k){var ps=m.kpis.map(function(kp){var s=kpiSum(kp);return mtd(s.t,s.a,k).pct;}).filter(function(p){return p!=null;});return ps.length?avg(ps):null;}

function rsoKpis(m,rid,g){
  if(!g){var mb=memberById(rid);g=mb?mb.g:'rso';}
  return m.kpis.filter(function(k){return g!=='bp'||k.bp;}).map(function(k){var x=rowOf(k,rid);var c=calc(x.t,x.a);c.k=k;return c;});
}

function rsoScore(m,rid,g){var ps=rsoKpis(m,rid,g).map(function(x){return x.pct;}).filter(function(p){return p!=null;});return ps.length?avg(ps):null;}

function ranking(m,g,k){
  g=g||'rso';
  return grp(g).map(function(r,i){
    var ks=rsoKpis(m,r.id,g);
    if(k)ks.forEach(function(x){x.ach=x.pct;x.pct=mtd(x.t,x.a,k).pct;});
    var ps=ks.map(function(x){return x.pct;}).filter(function(p){return p!=null;});
    return {r:r,i:i,g:g,score:ps.length?avg(ps):null,ach:rsoScore(m,r.id,g),
      bad:ks.filter(function(x){return x.pct!=null&&x.pct<70;}).map(function(x){return x.k.name;}),
      warn:ks.filter(function(x){return x.pct!=null&&x.pct>=70&&x.pct<90;}).map(function(x){return x.k.name;})};
  }).sort(function(a,b){return (b.score==null?-1:b.score)-(a.score==null?-1:a.score);});
}

function towerCats(){
  var thr=num(data.towerA)||400000;
  var ts=data.towers.map(function(t){return {id:t.id,name:t.name,lat:t.lat,lng:t.lng,rev:num(t.rev),sub:num(t.sub)};});
  var total=0,subs=0;ts.forEach(function(t){total+=t.rev;subs+=t.sub;});
  ts.forEach(function(t){t.cat=t.rev>=thr?'A':'B';t.arpu=t.sub>0?t.rev/t.sub:null;});
  ts.sort(function(a,b){return b.rev-a.rev;});
  ts.forEach(function(t,i){t.rank=i+1;t.share=total>0?t.rev/total*100:0;});
  return {ts:ts,total:total,subs:subs,thr:thr,arpu:subs>0?total/subs:null,max:ts.length?ts[0].rev:0};
}

    return '<table class="rso"><thead><tr><th>'+gLbl(g)+'</th><th>Target</th><th>Achievement</th><th>Gap</th><th>Achievement %</th><th>MTD (30 days)</th></tr></thead><tbody id="'+tid+'" data-g="'+g+'"></tbody></table>';

    if(!v[0])return 'Enter a KPI name.';

  var isCur=k===curKey(),dl=daysLeft(),perDay=s.gap>0?Math.ceil(s.gap/dl):0;

    '<div class="stat" style="--c:var(--blue)"><small>Total Target</small><b class="num">'+fmt(s.t)+'</b><em>'+(kp.bp?data.rsos.length+' RSOs + '+data.bps.length+' BPs':'All '+data.rsos.length+' RSOs')+'</em></div>'+
    '<div class="stat" style="--c:var(--good)"><small>Total Achievement</small><b class="num">'+fmt(s.a)+'</b><em>'+pctTxt(s.pct)+' of target</em></div>'+

    '<div class="stat" style="--c:var(--brand)"><small>MTD %</small><b class="s-'+status(q.pct)+'">'+pctTxt(q.pct)+'</b><em>Month-end → '+(q.proj==null?'—':fmt(q.proj))+'</em></div></div>'+
    '<section class="card overall" style="margin-bottom:14px"><div class="row"><b>Overall progress</b><span class="muted" style="font-size:13px">'+fmt(s.a)+' of '+fmt(s.t)+'</span></div>'+barHtml(s.pct)+
    '<div class="mtdbox"><div><small>MTD · day '+q.d+' of 30</small><b class="s-'+status(q.pct)+'">'+pctTxt(q.pct)+'</b><span>'+STLBL[status(q.pct)]+'</span></div>'+
      '<div><small>Month-end projection</small><b class="num">'+(q.proj==null?'—':fmt(q.proj))+'</b><span>at this pace, of '+fmt(s.t)+'</span></div>'+
      (isCur?'<button class="btn-s edonly" id="mtdD"><i>'+I.cal+'</i>Data up to day '+q.d+'</button>':'')+'</div>'+
    '<div class="chips" style="margin-top:12px">'+
    (pb?'<span class="chip c-blue">RSO: '+fmt(ps.a)+' / '+fmt(ps.t)+' · '+pctTxt(ps.pct)+'</span><span class="chip c-blue">BP: '+fmt(pb.a)+' / '+fmt(pb.t)+' · '+pctTxt(pb.pct)+'</span>':'')+
    (best?'<span class="chip c-good">🏆 Top: '+esc(best.n)+' · '+pctTxt(best.pct)+'</span>':'')+
    (worst&&worst!==best?'<span class="chip c-bad">🎯 Focus: '+esc(worst.n)+' · '+pctTxt(worst.pct)+'</span>':'')+
    (isCur?'<span class="chip c-blue">📅 '+(perDay>0?'Need '+fmt(perDay)+'/day · '+dl+' day(s) left':'No daily requirement — target covered')+'</span>':'')+

function drawRowsG(k,kp,g,sel){
  var mode=getSort();
  var rows=grp(g).map(function(r,i){var x=rowOf(kp,r.id),c=calc(x.t,x.a);c.r=r;c.i=i;return c;});
  if(mode==='pctDesc')rows.sort(function(a,b){return (b.pct==null?-1:b.pct)-(a.pct==null?-1:a.pct);});
  else if(mode==='pctAsc')rows.sort(function(a,b){return (a.pct==null?1e12:a.pct)-(b.pct==null?1e12:b.pct);});
  else if(mode==='gapDesc')rows.sort(function(a,b){return b.gap-a.gap;});
  $(sel).innerHTML=rows.length?rows.map(function(x,n){
    return '<tr data-r="'+x.r.id+'"><td class="c-name" data-label="'+gLbl(g)+'"><div class="namec"><span class="rank'+(mode==='pctDesc'&&n===0&&x.pct!=null?' r1':'')+'">'+(n+1)+'</span>'+
      '<button class="nlink" data-go="#/rso/'+x.r.id+'/'+k+'"><b>'+esc(x.r.name)+'</b><small>'+gLbl(g)+' '+(x.i+1)+' · view profile</small></button></div></td>'+
      '<td data-label="Target"><input class="cell n" data-f="t" type="number" inputmode="decimal" min="0" step="any" value="'+x.t+'" aria-label="Target for '+esc(x.r.name)+'"></td>'+
      '<td data-label="Achievement"><input class="cell n" data-f="a" type="number" inputmode="decimal" min="0" step="any" value="'+x.a+'" aria-label="Achievement for '+esc(x.r.name)+'"></td>'+
      '<td class="gap" data-label="Gap">'+gapHtml(x.gap)+'</td><td class="pc" data-label="Achievement %">'+pctHtml(x.pct)+'</td>'+
      '<td class="mtdc" data-label="MTD (30 days)">'+mtdHtml(x.t,x.a,k)+'</td></tr>';
  }).join(''):'<tr><td colspan="6"><div class="empty">No '+gLbl(g)+'s yet. Add them in FF Details.</div></td></tr>';
}

var KPRE=[
  {k:'C2C',t:/^ev secondary$|^ev c2c target$|^c2c target$|^c2c tgt$/,a:/^total c2c$|^c2c ach|^c2c achievement$|^c2c achv$/},

  {k:'A.LSO',t:/^a?\.?lso$|^a\.?lso (target|tgt)$/,a:/^a\.?lso (count|ach)/}

function detectPairs(hdr,orig){
  var out=[],seen={};
  KPRE.forEach(function(p){
    var okA=function(h){return h.indexOf('%')<0&&p.a.test(h);};
    var t=hdr.findIndex(function(h){return p.t.test(h);}),a=-1,i;
    if(t<0){
      if(!p.achOnly)return;
      a=hdr.findIndex(okA);if(a<0)return;
      out.push({k:p.k,t:-1,a:a});seen[p.k.toLowerCase()]=1;seen['#'+a]=1;return;
    }
    for(i=t+1;i<hdr.length;i++){if(okA(hdr[i])){a=i;break;}}
    if(a<0)a=hdr.findIndex(okA);
    if(a<0&&/count|ach/.test(hdr[t+1]||'')&&(hdr[t+1]||'').indexOf('%')<0)a=t+1;
    if(a<0)return;
    out.push({k:p.k,t:t,a:a});seen[p.k.toLowerCase()]=1;seen['#'+t]=1;seen['#'+a]=1;
  });
  hdr.forEach(function(h,i){
    var m=h.match(/^(.+?)\s*[-_ ]?\s*(target|tgt)$/);if(!m)return;
    var x=m[1].trim();if(!x||seen[x.toLowerCase()]||seen['#'+i])return;
    var a=hdr.findIndex(function(g){return g===x+' ach'||g===x+' achievement'||g===x+' achv'||g===x+' achieved'||g===x+' actual'||g===x+' count'||g===x+'-ach'||g===x+'_ach';});
    if(a<0)return;
    var nm=String(orig[i]).replace(/\s+/g,' ').trim().replace(/\s*[-_ ]?\s*(target|tgt)$/i,'');
    out.push({k:nm,t:i,a:a});seen[x.toLowerCase()]=1;

function headerRowOf(rows){

function cfgForSheet(job,sn,g,hrForce){
  var rows=job.sheets[sn]||[],hr=hrForce!=null?hrForce:headerRowOf(rows);

    for(i=hr+1;i<rows.length;i++){var v=(rows[i]||[])[c];if(typeof v==='string'&&v.trim().toLowerCase()===dd){filterCol=c;break;}}
  }

    :[/msisdn|i.?top|mobile|phone|number/,/rs[o0]\s*code/,/rso.*name|^name$|^rso$/];

function scoreSheet(job,sn,g,cfg){

function autoMatch(x,g){

  for(var i=0;i<keys.length;i++){var nk=normKey(keys[i]);if(rk[nk]&&inGrp(rk[nk],g))return {id:rk[nk],how:'saved'};}

function rowsFromText(text){

function nextJob(){
  IMP.ji++;

function commitJob(job){
  var M=data.months[IMP.month],names=[];
  data.rsoKeys=data.rsoKeys||{};data.importCfg=data.importCfg||{};
  if(IMP.month===curKey()&&IMP.day)M.mtdDay=IMP.day;
  jobParts(job).forEach(function(P){
    if(!P.cfg)return;
    P.cfg.maps.forEach(function(m,mi){
      if(!m.on)return;
      var kp=findKpiIn(M,m.kpi),isNew=false,bpOn=false;
      if(!kp){
        kp={id:uid(),name:m.kpi,rows:{},bp:P.g==='bp'};M.kpis.push(kp);isNew=true;
        Object.keys(data.months).filter(function(x){return x>IMP.month;}).forEach(function(x){if(!findKpiIn(data.months[x],m.kpi))data.months[x].kpis.push({id:uid(),name:m.kpi,rows:{},bp:P.g==='bp'});});
      }
      if(P.g==='bp'&&!kp.bp){kp.bp=true;bpOn=!isNew;}
      var E=P.edit[mi],n=0;
      grp(P.g).forEach(function(r){var e=E[r.id];if(!e||(!e.file&&!e.touched))return;kp.rows[r.id]={t:num(e.t),a:num(e.a)};n++;});
      var s=partSum(kp,P.g);IMP.done.push({kpi:kp.name,g:gLbl(P.g),n:n,mtd:mtd(s.t,s.a,IMP.month).pct,isNew:isNew,bpOn:bpOn});
      if(names.indexOf(kp.name)<0)names.push(kp.name);
    });
    P.rows.forEach(function(x){
      if(!x.rid)return;
      data.rsoKeys[normKey(x.key)]=x.rid;
      if(x.lab)data.rsoKeys[normKey(x.lab)]=x.rid;
      var nk=normKey(x.key),mb=memberById(x.rid);if(!mb)return;
      if(P.saveItop&&nk.charAt(0)==='p'&&!String(mb.m.itop||'').trim())mb.m.itop='0'+nk.slice(1);
      if(P.useNames&&x.nm&&/^(bp|rso) ?\d+$/i.test(String(mb.m.name).trim()))mb.m.name=x.nm;
    });
    if(!job.ocr){
      var hdr=(job.sheets[P.cfg.sheet][P.cfg.hr]||[]).map(normH);
      var keep={};Object.keys(data.importCfg).slice(-11).forEach(function(k){keep[k]=data.importCfg[k];});
      keep[sheetSig(P.cfg.sheet,hdr,P.g)]=JSON.parse(JSON.stringify(P.cfg));data.importCfg=keep;
      var fh=normH(((job.sheets[P.cfg.sheet]||[])[P.cfg.hr]||[])[P.cfg.filterCol]);
      if(P.cfg.filterCol>=0&&/dd|d_code|distributor/.test(fh)&&P.cfg.filterVal)data.ddCode=P.cfg.filterVal;
    }
  });
  data.lastImport={at:Date.now(),by:(USER&&USER.email)||'',file:job.name,kpis:names.join(', '),month:IMP.month};
  data.sampleNotice=false;
  save();
  toast('Saved '+names.join(', '));
}

}

    try{document.execCommand('copy');toast('Link copied');}catch(e){toast('Could not copy — long-press the link to copy');}ta.remove();}

function ago(ms){
  if(!ms)return 'never';var d=(Date.now()-ms)/1000;
  if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+' min ago';if(d<86400)return Math.floor(d/3600)+' hr ago';
  if(d<86400*7)return Math.floor(d/86400)+' day'+(d<172800?'':'s')+' ago';
  return new Date(ms).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function hhmm(ms){return new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:true}).replace(' ',' ');}
function dayLbl(ms){
  var d=new Date(ms),t=new Date();t.setHours(0,0,0,0);var x=new Date(d);x.setHours(0,0,0,0);
  var diff=Math.round((t-x)/86400000);
  return diff===0?'Today':diff===1?'Yesterday':d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
}

function authMsg(e){
  var c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Wrong email or password. Try again.';
  if(/invalid-email/.test(c))return 'That email address does not look right.';
  if(/too-many-requests/.test(c))return 'Too many tries. Wait a few minutes, then try again.';
  if(/network-request-failed/.test(c))return 'No internet connection. Check your data or Wi-Fi.';
  if(/user-disabled/.test(c))return 'This account has been disabled.';
  if(/weak-password/.test(c))return 'New password is too weak. Use at least 6 characters.';
  if(/requires-recent-login/.test(c))return 'Please log out and log in again, then change the password.';
  return 'Something went wrong ('+(c||'unknown')+'). Try again.';
}
function loginErr(m,good){
  var el=$('#lerr');el.textContent=m;el.style.color=good?'var(--good)':'';
  if(!good){var c=$('#loginForm');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}
}

/* ---------- cloud sync ---------- */
function applyRemote(j,by){
  if(j===lastJson)return;
  var nd;try{nd=JSON.parse(j);}catch(e){return;}
  if(!valid(nd))return;
  lastJson=j;data=fix(nd);store.set(KEY,j);
  if(by&&USER&&by!==USER.email)toast('Updated by '+by.split('@')[0]);
  softRender();
}
function onRemote(j,by){
  if(pushT)return;                     /* my unsent change wins */
  if(busy()){pendingRemote={j:j,by:by};return;}
  applyRemote(j,by);
}
function checkRole(){
  var t=new Promise(function(res){setTimeout(function(){res('timeout');},7000);});
  var w=FB.setDoc(FB.doc(FB.db,'meta','ping_'+USER.uid),{by:USER.email||'',at:FB.serverTimestamp()})
    .then(function(){return 'ok';},function(e){return (e&&e.code)||'err';});
  return Promise.race([w,t]).then(function(r){
    RO=(r==='permission-denied');
    if(r==='ok')setSync('● Live','live');else if(RO)setSync('View only','ro');else setSync('Offline','off');
  });
}
function stopListeners(){if(unsub){unsub();unsub=null;}if(unsubV){unsubV();unsubV=null;}}
function snapExists(sn){return typeof sn.exists==='function'?sn.exists():!!sn.exists;}
function startData(after){
  var first=true;
  unsub=FB.onSnapshot(FB.doc(FB.db,'etis','main'),function(snap){
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    var exists=snapExists(snap);
    if(!exists){CLOUD_EMPTY=true;}
    else{
      CLOUD_EMPTY=false;var d=snap.data()||{};
      if(first){
        var nd;try{nd=JSON.parse(d.json);}catch(e){}
        if(valid(nd)){lastJson=d.json;data=fix(nd);store.set(KEY,d.json);}
      }else onRemote(d.json,d.by);
    }
    if(first){first=false;after().then(function(){READY=true;render();});}
    else if(!exists&&READY)softRender();
  },function(err){
    if(BLOCKED)return;
    if(VIEWER&&err&&err.code==='permission-denied'){BLOCKED='off';stopListeners();render();return;}
    toast('Cloud error: '+((err&&err.code)||'unknown'));
    if(first){first=false;READY=true;setSync('Offline','off');render();}
  });
}
function checkOwner(){
  return FB.getDoc(FB.doc(FB.db,'meta','ownercheck')).then(function(){OWNER=true;},function(){OWNER=false;});
}
function enterViewer(u){
  FB.getDoc(FB.doc(FB.db,'viewers',TOKEN)).then(function(sn){
    var d=snapExists(sn)?sn.data():null;
    if(!d||!d.active){BLOCKED='off';try{localStorage.removeItem('etis_vtoken');}catch(e){}render();return;}
    VIEWER={name:d.name||'Viewer'};
    return FB.setDoc(FB.doc(FB.db,'sessions',u.uid),{token:TOKEN,name:VIEWER.name,dev:devName(),atMs:Date.now(),at:FB.serverTimestamp()}).then(function(){
      store.set('etis_vtoken',TOKEN);RO=true;CLOUD_EMPTY=false;setSync('View only','ro');
      unsubV=FB.onSnapshot(FB.doc(FB.db,'viewers',TOKEN),function(s2){
        var d2=snapExists(s2)?s2.data():null;
        if(!d2||!d2.active){BLOCKED='off';stopListeners();try{localStorage.removeItem('etis_vtoken');}catch(e){}render();}
      },function(){});
      startData(function(){return Promise.resolve();});
    });
  }).catch(function(e){
    BLOCKED=(e&&e.code==='permission-denied')?'off':'Check your internet connection and open the link again.';render();
  });
}
function bootCloud(){
  MODE='cloud';
  FB.onAuth(function(u){
    stopListeners();
    USER=u;READY=false;RO=false;CLOUD_EMPTY=false;pendingRemote=null;VIEWER=null;OWNER=false;
    document.body.classList.remove('ro','viewer');
    if(!u){
      setSync('','');
      if(TOKEN&&!BLOCKED){
        render();
        FB.signInAnon().catch(function(e){
          BLOCKED=(e&&/admin-restricted|operation-not-allowed/.test(e.code||''))
            ?'Viewer links are not switched on yet. Ask Emon to enable them in Firebase.'
            :'Check your internet connection and open the link again.';
          render();
        });
        return;
      }
      render();return;
    }
    if(u.isAnonymous){
      if(!TOKEN){FB.signOut();return;}
      render();enterViewer(u);return;
    }
    /* email user: editor or owner */
    BLOCKED='';
    if(URLTOKEN)toast('You are logged in as editor. To test a viewer link, open it in an incognito window.');
    TOKEN='';try{localStorage.removeItem('etis_vtoken');}catch(e){}
    render();
    startData(function(){return Promise.all([checkRole(),checkOwner()]);});
  });
}
function bootFB(){
  if(FBDONE)return;FBDONE=true;clearTimeout(fbTimer);
  if(window.ETIS_FB){FB=window.ETIS_FB;bootCloud();}
  else{MODE='local';render();}
}

$('#loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  var u=$('#lu').value.trim(),pw=$('#lp').value;
  if(MODE==='loading')return;
  if(MODE==='cloud'){
    if(!u||!pw){loginErr('Enter your email and password.');return;}
    var b=$('#lbtn');b.disabled=true;b.textContent='Logging in…';
    FB.signIn(u,pw).then(function(){$('#lp').value='';$('#lerr').textContent='';if(location.hash!=='#/home')location.hash='#/home';},
      function(er){loginErr(authMsg(er));}).then(function(){b.disabled=false;b.textContent='Login';});
    return;
  }
  if(u===data.auth.user&&pw===data.auth.pass){
    store.set(AUTH,'1');$('#lerr').textContent='';$('#lp').value='';
    if(location.hash!=='#/home')location.hash='#/home';else render();
  }else loginErr('Wrong username or password. Try again.');
});
$('#forgot').onclick=function(){
  var u=$('#lu').value.trim();
  if(!u){loginErr('Type your email above first, then tap “Forgot password?”.');return;}
  FB.reset(u).then(function(){loginErr('Password reset email sent to '+u+'. Check your inbox and spam folder.',true);},function(er){loginErr(authMsg(er));});
};
$('#eye').onclick=function(){var i=$('#lp');i.type=i.type==='password'?'text':'password';};
$('#setBtn').onclick=function(){location.hash='#/settings';};
$('#logoutBtn').onclick=function(){
  if(!confirm('Log out of ETIS?'))return;
  if(MODE==='cloud'){if(pushT)push();FB.signOut();location.hash='#/home';return;}
  store.del(AUTH);$('#lu').value='';location.hash='#/login';render();
};

var fbTimer=null;
render();
if(window.ETIS_FB||window.ETIS_FB_FAIL)bootFB();
else{
  window.addEventListener('etis-fb',bootFB);
  fbTimer=setTimeout(function(){if(!FBDONE){FBDONE=true;MODE='local';render();toast('Cloud not reachable — offline mode');}},15000);
}
})();
</script>
</body>
</html>
