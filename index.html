<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F26522">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>ETIS / KHUCHU04</title>
<style>
:root{
  --brand:#F26522;--brand-d:#c94f14;--brand-l:#fff2ea;
  --ink:#1b2232;--muted:#6b7385;--line:#e6e9ef;--bg:#f4f6fa;--card:#fff;
  --good:#16a34a;--good-l:#e7f6ec;--warn:#d98a00;--warn-l:#fff5df;--bad:#dc2626;--bad-l:#fdecec;
  --blue:#2563eb;--blue-l:#eaf1ff;--na:#9aa3b2;--wa:#128c4a;--wa-l:#e5f6ec;
  --r:16px;--sh:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg{width:100%;height:100%;display:block}
.hidden{display:none!important}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(circle at 15% 10%,#ffe3d1 0,transparent 40%),radial-gradient(circle at 90% 90%,#e3ecff 0,transparent 45%),var(--bg)}
.lcard{width:100%;max-width:400px;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(16,24,40,.12);padding:32px 26px 24px}
.logo{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--brand),#ff9a4d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;box-shadow:0 8px 20px rgba(242,101,34,.35);margin-bottom:18px}
.lcard h1{font-size:26px;letter-spacing:-.5px}
.lcard h1 span{color:var(--brand)}
.lsub{color:var(--muted);font-size:13.5px;margin:4px 0 24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.inwrap{position:relative;display:flex;align-items:center}
.inwrap .ic{position:absolute;left:13px;width:18px;height:18px;color:var(--na)}
.inwrap input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 44px 0 42px;font-size:16px;background:#fafbfc;outline:none}
.inwrap input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(242,101,34,.12)}
.eye{position:absolute;right:8px;width:34px;height:34px;padding:7px;color:var(--muted);border-radius:8px}
.btn{height:50px;border-radius:12px;font-weight:700;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 8px 18px rgba(242,101,34,.3)}
.btn-p:active{transform:scale(.98);background:var(--brand-d)}
.lerr{color:var(--bad);font-size:13.5px;min-height:20px;margin:2px 0 8px;font-weight:600}
.demo{margin-top:18px;background:var(--blue-l);color:#1e3a8a;border-radius:12px;padding:10px 14px;font-size:13px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* SHELL */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;height:60px;display:flex;align-items:center;gap:8px;padding:0 10px}
.tb-btn{width:40px;height:40px;border-radius:12px;padding:9px;flex:none}
.tb-btn:hover{background:var(--bg)}
.tb-brand{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#ff9a4d);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-left:4px}
.tb-t{flex:1;min-width:0}
.tb-t b{display:block;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-t small{display:block;color:var(--muted);font-size:12px;margin-top:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:12px;color:var(--good);font-weight:600;opacity:0;transition:opacity .3s;white-space:nowrap}
.saved.on{opacity:1}
.tb-ic{width:38px;height:38px;border-radius:10px;padding:9px;color:var(--muted);border:1px solid var(--line);background:#fff;flex:none}
.logout{color:var(--bad);border-color:#f5d0d0}
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px 56px}

/* CARDS & COMMON */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid #eef0f4;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mt{margin-top:14px}
.sec-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;margin:24px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{border-radius:20px;padding:22px 20px;color:#fff;background:linear-gradient(130deg,#F26522 0%,#ff8a3d 55%,#ffb070 100%);display:flex;justify-content:space-between;align-items:center;gap:14px;position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(242,101,34,.25)}
.hero:after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero>div{position:relative;z-index:1;min-width:0}
.hero-k{font-size:13.5px;opacity:.92}
.hero h1{font-size:23px;letter-spacing:-.4px;margin:2px 0}
.hero-s{font-size:13px;opacity:.9}
.score{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:10px 14px;text-align:center;min-width:100px}
.score b{display:block;font-size:24px;line-height:1.1}
.score small{font-size:11px;opacity:.95;text-transform:uppercase;letter-spacing:.4px}
.navcard{display:block;text-align:left;width:100%;cursor:pointer;transition:transform .15s,box-shadow .15s}
.navcard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(16,24,40,.1)}
.nc-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.nc-h>div{min-width:0}
.icotile{width:48px;height:48px;border-radius:14px;padding:12px;flex:none}
.it-o{background:var(--brand-l);color:var(--brand)}.it-b{background:var(--blue-l);color:var(--blue)}.it-g{background:var(--good-l);color:var(--good)}.it-p{background:#f3e8ff;color:#7c3aed}.it-y{background:var(--warn-l);color:var(--warn)}
.nc-h h2{font-size:18px;letter-spacing:-.3px}
.nc-h p{font-size:13px;color:var(--muted)}
.nc-go{margin-left:auto;width:30px;height:30px;padding:6px;border-radius:50%;background:var(--bg);color:var(--muted);flex:none}
.mini{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13.5px}
.mini span:first-child{width:96px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .bar{flex:1}
.mini b{width:58px;text-align:right}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tstat{background:var(--bg);border-radius:12px;padding:10px;min-width:0}
.tstat small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.tstat b{font-size:16px;word-break:break-word}
.bar{height:8px;border-radius:99px;background:#edf0f5;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.b-good{background:var(--good)}.b-warn{background:var(--warn)}.b-bad{background:var(--bad)}.b-na{background:var(--na)}.b-brand{background:var(--brand)}.b-grey{background:#a8b0bf}
.s-good{color:var(--good)}.s-warn{color:var(--warn)}.s-bad{color:var(--bad)}.s-na{color:var(--na)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-good{background:var(--good-l);color:#166534}.p-warn{background:var(--warn-l);color:#8a5600}.p-bad{background:var(--bad-l);color:#991b1b}.p-na{background:#eef0f4;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:5px 10px;border-radius:99px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.c-good{background:var(--good-l);color:#166534}.c-bad{background:var(--bad-l);color:#991b1b}.c-warn{background:var(--warn-l);color:#8a5600}.c-blue{background:var(--blue-l);color:#1e40af}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h3{font-size:16.5px}
.btn-s{height:38px;padding:0 13px;border-radius:10px;background:var(--brand-l);color:var(--brand-d);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-s i{width:16px;height:16px;display:block}
.btn-o{min-height:46px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;text-align:center}
.btn-o i{width:18px;height:18px;display:block;flex:none}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-danger{color:var(--bad);border-color:#f3c6c6}
.btn-blue{color:var(--blue);border-color:#c9d8fb}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions>*{flex:1 1 200px}
.icbtn{width:40px;height:40px;border-radius:10px;padding:10px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.icbtn.call{background:var(--blue-l);color:var(--blue)}
.icbtn.wa{background:var(--wa-l);color:var(--wa)}
.icbtn.del{background:var(--bad-l);color:var(--bad)}
.cbox{display:inline-flex;gap:6px}
.cbox:empty{display:none}
.notice{background:var(--warn-l);border:1px solid #f3dca4;color:#6e4500;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:13.5px}
.notice .sp{flex:1 1 220px}
.notice button{font-weight:700;font-size:13px;padding:7px 12px;border-radius:9px;background:#fff;border:1px solid #f3dca4}
.addcard{border:2px dashed #d3d9e3;border-radius:var(--r);display:flex;align-items:center;justify-content:center;gap:8px;min-height:110px;color:var(--brand);font-weight:700;background:transparent;width:100%}
.addcard i{width:22px;height:22px;display:block}
.addcard:hover{background:#fffaf6;border-color:var(--brand)}
.badge-now{font-size:11px;font-weight:800;background:var(--brand);color:#fff;border-radius:99px;padding:2px 8px;text-transform:uppercase;letter-spacing:.4px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mhead b{font-size:17px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 6px;gap:8px}
.mrow .big{font-size:24px;font-weight:800;letter-spacing:-.5px}
.kcard{position:relative}
.kdel{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:9px;padding:8px;color:var(--na)}
.kdel:hover{background:var(--bad-l);color:var(--bad)}
.msel{height:42px;border:1.5px solid var(--line);border-radius:11px;padding:0 10px;background:#fff;font-weight:600;max-width:100%}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:14px;border:1px solid #eef0f4;box-shadow:var(--sh);position:relative;overflow:hidden;min-width:0}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--brand))}
.stat small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.stat b{display:block;font-size:22px;letter-spacing:-.5px;margin-top:2px;word-break:break-word}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.overall .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.overall .bar{height:12px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(16,24,40,.1)}

/* KPI TABLE */
table.rso{width:100%;border-collapse:separate;border-spacing:0}
table.rso th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);background:#fafbfc}
table.rso td{padding:8px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
.cell{width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px;background:#fff;outline:none;min-width:0}
.cell:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(242,101,34,.12)}
.cell.n{max-width:130px;text-align:right;font-variant-numeric:tabular-nums}
.namec{display:flex;align-items:center;gap:8px}
.nlink{text-align:left;min-width:0}
.nlink b{display:block;font-size:14.5px}
.nlink small{display:block;font-size:11.5px;color:var(--muted)}
.nlink:hover b{color:var(--brand)}
.rank{width:28px;height:28px;border-radius:8px;background:var(--bg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.rank.r1{background:#fff3c4;color:#92400e}
.gapv{font-weight:700}
.ahead{color:var(--good);font-weight:700;font-size:13.5px}
.pcell{min-width:120px}
.pcell .pv{font-weight:800;font-size:14.5px;margin-bottom:5px}

/* LIST ROWS */
.trow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:8px;cursor:pointer;transition:.15s}
.trow:hover{border-color:var(--brand);background:#fffaf6}
.trow .tn{flex:1;min-width:0}
.trow .tn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.trow .tn small{display:block;color:var(--muted);font-size:12px}
.trow .tn .bar{height:6px;margin-top:6px}
.trow .tr{text-align:right;font-weight:700;font-size:14.5px;white-space:nowrap}
.trow .tr small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.trow .go{width:20px;height:20px;color:var(--na);flex:none}
.empty{color:var(--muted);font-size:13.5px;padding:14px;text-align:center;background:var(--bg);border-radius:12px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;border-radius:9px;font-weight:800;font-size:14px}
.bA{background:var(--good-l);color:var(--good)}.bB{background:var(--warn-l);color:var(--warn)}
.catcol h3{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:10px}
.rule{font-size:13.5px;color:var(--muted);background:#fff;border:1px dashed #d8dde6;border-radius:12px;padding:10px 12px;margin:14px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rule input{width:130px;height:38px}

/* FIELDS */
.frow{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f2f6}
.frow:last-child{border-bottom:0}
.flbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;word-break:break-word}
.fin{display:flex;gap:6px;align-items:center;min-width:0}
.fin .cell{flex:1}
.phead{display:flex;gap:14px;align-items:center}
.avatar{width:58px;height:58px;border-radius:16px;background:var(--brand-l);color:var(--brand);font-weight:800;font-size:23px;display:flex;align-items:center;justify-content:center;flex:none}
.phead small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.phead h2{font-size:21px;letter-spacing:-.3px;word-break:break-word}
.rsorow{display:grid;grid-template-columns:34px 1.2fr 1fr auto 26px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f2f6}
.rsorow:last-child{border:0}
.rsorow .go{width:24px;height:24px;padding:3px;color:var(--na);border-radius:6px}
.rsorow label{display:block;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kv div{background:#fff;border:1px solid #eef0f4;border-radius:14px;padding:12px;text-align:center;box-shadow:var(--sh);min-width:0}
.kv small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.3px}
.kv b{font-size:18px;word-break:break-word}
.detail-hero{text-align:center;padding:24px 18px}
.detail-hero .badge{font-size:22px;height:54px;min-width:54px;border-radius:16px;margin-bottom:10px}
.detail-hero h2{font-size:21px;word-break:break-word}
.detail-hero .rev{font-size:30px;font-weight:800;color:var(--brand);margin-top:4px}
.kline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid #f0f2f6;align-items:center}
.kline:last-child{border:0}
.kline .bar{grid-column:1/-1}
.kline small{color:var(--muted);font-size:12.5px}
.hist{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;padding:7px 0}
.hist b{text-align:right}
.msbar{display:grid;grid-template-columns:100px 1fr 56px;gap:10px;align-items:center;margin:8px 0}
.msbar .bar{height:14px}
.msbar b{text-align:right}
textarea.cell{height:110px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;font-size:12.5px;color:var(--muted)}

/* SHEET + TOAST */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh-back{position:absolute;inset:0;background:rgba(15,20,30,.45)}
.sh-card{position:relative;background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-h b{font-size:18px}
.sh-f{display:block;margin-bottom:12px}
.sh-f span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.sh-f input,.sh-f select{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:#fff;outline:none}
.sh-f input:focus,.sh-f select:focus{border-color:var(--brand)}
.sh-err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px;font-weight:600}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1b2232;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:600px){#sheet{align-items:center}.sh-card{border-radius:20px}}

/* SYNC */
.sync{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;background:#eef0f4;color:var(--muted)}
.sync.live{background:var(--good-l);color:#166534}
.sync.ro{background:var(--blue-l);color:#1e40af}
.sync.off{background:var(--warn-l);color:#8a5600}
.lmode{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px}

function seedBps(){var a=[];for(var i=1;i<=5;i++)a.push({id:'b'+i,name:'BP '+i,itop:'',fields:[]});return a;}

function valid(d){return d&&d.v===2&&Array.isArray(d.rsos)&&d.rsos.length&&d.months&&typeof d.months==='object'&&Array.isArray(d.towers);}
function fix(d){
  var s=seed();
  d.rsoKeys=d.rsoKeys||{};d.importCfg=d.importCfg||{};d.ddCode=d.ddCode||'KHUCHU04';
  d.auth=d.auth&&d.auth.user?d.auth:s.auth;
  d.people=d.people||s.people;
  ['distributor','manager','accountant'].forEach(function(k){if(!d.people[k])d.people[k]=s.people[k];});
  d.territory=d.territory||s.territory;
  d.sort=d.sort||{kpi:'default'};
  if(!num(d.towerA))d.towerA=400000;
  d.rsos.forEach(function(r){r.fields=r.fields||[];if(r.itop==null)r.itop='';});
  var newBp=!Array.isArray(d.bps);
  if(newBp)d.bps=seedBps();
  d.bps.forEach(function(r){r.fields=r.fields||[];if(r.itop==null)r.itop='';});
  Object.keys(d.months).forEach(function(k){var m=d.months[k];m.kpis=m.kpis||[];m.kpis.forEach(function(kp){kp.rows=kp.rows||{};if(newBp&&kp.name.toLowerCase()==='ga')kp.bp=true;kp.bp=!!kp.bp;});});
  return d;
}

/* ================= CALCULATIONS ================= */

function calc(t,a){t=num(t);a=num(a);return {t:t,a:a,gap:t-a,pct:t>0?(a/t)*100:null};}
function rowOf(kp,rid){return kp.rows[rid]||{t:0,a:0};}
function HOUSE(){return {id:'house',name:(data.ddCode||'KHUCHU04')+' House',itop:'',fields:[]};}
function grp(g){return g==='house'?[HOUSE()]:g==='bp'?(data.bps||[]):data.rsos;}
function gLbl(g){return g==='house'?'House':g==='bp'?'BP':'RSO';}
function memberById(id){
  var i=data.rsos.findIndex(function(x){return x.id===id;});if(i>=0)return {m:data.rsos[i],g:'rso',i:i};
  i=(data.bps||[]).findIndex(function(x){return x.id===id;});if(i>=0)return {m:data.bps[i],g:'bp',i:i};
  return null;
}
function mtdDay(k){
  var cur=curKey();if(k<cur)return 30;if(k>cur)return 0;
  var M=data.months[k],d=M&&num(M.mtdDay)?num(M.mtdDay):Math.max(1,new Date().getDate()-1);
  return Math.min(30,Math.max(1,Math.round(d)));
}
function mtd(t,a,k){
  var d=mtdDay(k);t=num(t);a=num(a);
  if(!d)return {proj:null,pct:null,d:0};
  var proj=a/d*30;return {proj:proj,pct:t>0?proj/t*100:null,d:d};
}
function mtdHtml(t,a,k){
  var m=mtd(t,a,k);
  return '<div class="pcell"><div class="pv s-'+status(m.pct)+'">'+pctTxt(m.pct)+'</div><small class="muted num">'+(m.proj==null?'—':'→ '+fmt(m.proj)+' by month end')+'</small></div>';
}
function prevKey(k){var p=k.split('-');var d=new Date(+p[0],+p[1]-2,1);return mkey(d);}
function snapNow(k,day){
  var M=data.months[k];if(!M||!day)return;
  var S={};
  M.kpis.forEach(function(kp){var o={};Object.keys(kp.rows).forEach(function(id){var x=kp.rows[id];if(x)o[id]=num(x.a);});o._h=kpiSum(kp).a;S[kp.name]=o;});
  M.snaps=M.snaps||{};M.snaps[day]=S;
  var keep=prevKey(curKey());
  Object.keys(data.months).forEach(function(x){if(x<keep&&data.months[x].snaps)delete data.months[x].snaps;});
}
function partSum(kp,g){var T=0,A=0;grp(g).forEach(function(r){var x=rowOf(kp,r.id);T+=num(x.t);A+=num(x.a);});return calc(T,A);}
function ffSum(kp){var a=partSum(kp,'rso');if(!kp.bp)return a;var b=partSum(kp,'bp');return calc(a.t+b.t,a.a+b.a);}
function kpiSum(kp){if(kp.scope==='house'||kp.useHouse){var h=kp.rows.house;if(h||kp.scope==='house')return calc(h?h.t:0,h?h.a:0);}return ffSum(kp);}

function monthScore(m){var ps=m.kpis.map(function(k){return kpiSum(k).pct;}).filter(function(p){return p!=null;});return ps.length?avg(ps):null;}
function monthMtd(m,k){var ps=m.kpis.map(function(kp){var s=kpiSum(kp);return mtd(s.t,s.a,k).pct;}).filter(function(p){return p!=null;});return ps.length?avg(ps):null;}

function rsoKpis(m,rid,g){
  if(!g){var mb=memberById(rid);g=mb?mb.g:'rso';}
  return m.kpis.filter(function(k){return k.scope!=='house'&&(g!=='bp'||k.bp);}).map(function(k){var x=rowOf(k,rid);var c=calc(x.t,x.a);c.k=k;return c;});
}

function rsoScore(m,rid,g){var ps=rsoKpis(m,rid,g).map(function(x){return x.pct;}).filter(function(p){return p!=null;});return ps.length?avg(ps):null;}

function ranking(m,g,k){
  g=g||'rso';
  return grp(g).map(function(r,i){
    var ks=rsoKpis(m,r.id,g);
    if(k)ks.forEach(function(x){x.ach=x.pct;x.pct=mtd(x.t,x.a,k).pct;});
    var ps=ks.map(function(x){return x.pct;}).filter(function(p){return p!=null;});
    return {r:r,i:i,g:g,score:ps.length?avg(ps):null,ach:rsoScore(m,r.id,g),
      bad:ks.filter(function(x){return x.pct!=null&&x.pct<70;}).map(function(x){return x.k.name;}),
      warn:ks.filter(function(x){return x.pct!=null&&x.pct>=70&&x.pct<90;}).map(function(x){return x.k.name;})};
  }).sort(function(a,b){return (b.score==null?-1:b.score)-(a.score==null?-1:a.score);});
}

function towerCats(){
  var thr=num(data.towerA)||400000;
  var ts=data.towers.map(function(t){return {id:t.id,name:t.name,lat:t.lat,lng:t.lng,rev:num(t.rev),sub:num(t.sub)};});
  var total=0,subs=0;ts.forEach(function(t){total+=t.rev;subs+=t.sub;});
  ts.forEach(function(t){t.cat=t.rev>=thr?'A':'B';t.arpu=t.sub>0?t.rev/t.sub:null;});
  ts.sort(function(a,b){return b.rev-a.rev;});
  ts.forEach(function(t,i){t.rank=i+1;t.share=total>0?t.rev/total*100:0;});
  return {ts:ts,total:total,subs:subs,thr:thr,arpu:subs>0?total/subs:null,max:ts.length?ts[0].rev:0};
}

function fieldsText(title,arr){

  return '*ETIS · KHUCHU04*\n*'+title+'*\n'+(l.length?l.join('\n'):'(no details added)');
}

/* ================= SHARE TEXTS ================= */
var HDR='*ETIS · KHUCHU04*\n';
function kpiText(k,kp){
  var s=kpiSum(kp),mm=mtd(s.t,s.a,k);
  var t=HDR+'*'+kp.name+' – '+mlabel(k)+'*'+(kp.bp?' (RSO + BP)':'')+'\nTarget: '+fmt(s.t)+' | Ach: '+fmt(s.a)+' | Gap: '+fmt(Math.max(s.gap,0))+' | '+pctTxt(s.pct)+'\n';
  if(mm.pct!=null)t+='MTD (day '+mm.d+'/30): '+pctTxt(mm.pct)+' '+DOT[status(mm.pct)]+' → month-end '+fmt(mm.proj)+'\n';
  if(k===curKey()&&s.gap>0){var dl=daysLeft();t+='Need/day: '+fmt(Math.ceil(s.gap/dl))+' ('+dl+' days left)\n';}
  (kp.scope==='house'?[]:['rso'].concat(kp.bp?['bp']:[])).forEach(function(g){
    var ps=partSum(kp,g);
    t+='\n*'+gLbl(g)+'-wise* ('+fmt(ps.a)+'/'+fmt(ps.t)+')\n';
    grp(g).forEach(function(r,i){var x=rowOf(kp,r.id),c=calc(x.t,x.a),q=mtd(c.t,c.a,k);t+=(i+1)+'. '+r.name+': '+fmt(c.a)+'/'+fmt(c.t)+' ('+pctTxt(c.pct)+') · MTD '+pctTxt(q.pct)+' '+DOT[status(q.pct)]+'\n';});
  });
  return t;
}

function summaryText(k){
  var m=data.months[k];
  var t=HDR+'*Overall KPI Summary – '+mlabel(k)+'*\nTerritory score: '+pctTxt(monthScore(m))+' · MTD '+pctTxt(monthMtd(m,k))+' (day '+mtdDay(k)+'/30)\n\n';
  m.kpis.forEach(function(kp){var s=kpiSum(kp),q=mtd(s.t,s.a,k);t+=DOT[status(q.pct)]+' '+kp.name+(kp.bp?' (RSO+BP)':'')+': '+fmt(s.a)+'/'+fmt(s.t)+' · '+pctTxt(s.pct)+' · MTD '+pctTxt(q.pct)+'\n';});
  ['rso'].concat(m.kpis.some(function(x){return x.bp;})?['bp']:[]).forEach(function(g){
    t+='\n*'+gLbl(g)+' ranking*\n';
    ranking(m,g,k).forEach(function(x,i){t+=(i+1)+'. '+x.r.name+': MTD '+pctTxt(x.score)+' '+DOT[status(x.score)]+(x.bad.length?' – behind in '+x.bad.join(', '):'')+'\n';});
  });
  return t;
}

function rsoText(r,k,g){
  var m=data.months[k],sc=rsoScore(m,r.id,g);
  var t=HDR+'*'+r.name+' ('+gLbl(g)+') – '+mlabel(k)+'*\n'+(r.itop?(g==='bp'?'Mobile: ':'iTop-up: ')+r.itop+'\n':'')+'Overall: '+pctTxt(sc)+' '+DOT[status(sc)]+'\n\n';
  rsoKpis(m,r.id,g).forEach(function(x){var q=mtd(x.t,x.a,k);t+=DOT[status(q.pct)]+' '+x.k.name+': '+fmt(x.a)+'/'+fmt(x.t)+' ('+pctTxt(x.pct)+') · MTD '+pctTxt(q.pct)+' → '+fmt(q.proj)+'\n';});
  return t;
}

function towersText(){
  var c=towerCats();
  var t=HDR+'*Tower (BTS) Summary*\nTotal BTS: '+c.ts.length+' | Revenue: '+tk(c.total)+'\nSub base: '+fmt(c.subs)+' | ARPU: '+arpuTxt(c.arpu)+'\nCategory A = revenue ≥ '+tk(c.thr)+'\n\n';
  ['A','B'].forEach(function(cat){
    t+='*Category '+cat+'*\n';var l=c.ts.filter(function(x){return x.cat===cat;});
    if(!l.length)t+='—\n';
    l.forEach(function(x){t+=x.rank+'. '+x.name+': '+tk(x.rev)+' | Sub '+fmt(x.sub)+' | ARPU '+arpuTxt(x.arpu)+'\n';});
    t+='\n';
  });
  return t;
}
function towerText(x){
  return HDR+'*BTS: '+x.name+'*\nCategory: '+x.cat+'\nRevenue: '+tk(x.rev)+'\nSub base: '+fmt(x.sub)+'\nARPU: '+arpuTxt(x.arpu)+'\nRank: #'+x.rank+(x.lat&&x.lng?'\nLocation: https://maps.google.com/?q='+x.lat+','+x.lng:'');
}

  '<div class="chips">'+(bpk.length?bpk.map(function(x){return '<span class="chip c-blue">'+esc(x.name)+'<button class="edonly bpx" data-act="bprm" data-id="'+x.id+'" aria-label="Remove BP from '+esc(x.name)+'">×</button></span>';}).join(''):'<span class="muted" style="font-size:13px">No BP KPI in this month.</span>')+'</div></section>'+
  '<p class="muted" style="font-size:12.5px;margin-top:12px">MTD uses a 30-day month: achievement ÷ days passed × 30. A KPI you add here is also added to later months automatically. Deleting removes it from this month only.</p>';
  function later(fn){Object.keys(data.months).filter(function(x){return x>k;}).forEach(function(x){fn(data.months[x]);});}
  view.onclick=function(e){
    var b=e.target.closest('[data-act]');if(!b)return;
    e.stopPropagation();
    if(b.dataset.act==='imp'){IMP={step:'pick',month:k};location.hash='#/import';return;}
    if(b.dataset.act==='add'){
      formSheet('Add KPI to '+mlabel(k),[{label:'KPI name',ph:'e.g. Recharge, MFS, 4G Device, SIM Swap'},{label:'Who has this KPI?',type:'select',value:'ff',options:[['ff','RSOs (each RSO has a target)'],['house','House only (one number for the distribution house)']]}],'Add KPI',function(v){
        var n=v[0],sc=v[1]==='house'?'house':'ff';if(!n)return 'Enter a KPI name.';
        var same=function(x){return x.name.toLowerCase()===n.toLowerCase();};
        if(m.kpis.some(same))return 'This KPI already exists in this month.';
        m.kpis.push({id:uid(),name:n,rows:{},bp:false,scope:sc});
        later(function(mm){if(!mm.kpis.some(same))mm.kpis.push({id:uid(),name:n,rows:{},bp:false,scope:sc});});
        save();monthView(k);toast('KPI added');
      });
    }else if(b.dataset.act==='bpadd'){
      var opts=m.kpis.filter(function(x){return !x.bp;}).map(function(x){return [x.id,x.name];}).concat([['__new','+ New KPI (type name below)']]);
      formSheet('Add KPI for BP',[{label:'KPI',type:'select',value:opts[0][0],options:opts},{label:'New KPI name (only for a new KPI)',ph:'e.g. Recharge'}],'Add for BP',function(v){
        var kp,n;
        if(v[0]==='__new'){
          n=v[1];if(!n)return 'Type the new KPI name.';
          if(findKpiIn(m,n))return 'This KPI already exists. Pick it from the list instead.';
          kp={id:uid(),name:n,rows:{},bp:true};m.kpis.push(kp);
        }else{kp=m.kpis.find(function(x){return x.id===v[0];});if(!kp)return 'Pick a KPI.';kp.bp=true;n=kp.name;}
        later(function(mm){var x=findKpiIn(mm,n);if(x)x.bp=true;else mm.kpis.push({id:uid(),name:n,rows:{},bp:true});});
        save();monthView(k);toast(n+' now has BP targets');
      });
    }else if(b.dataset.act==='bprm'){
      var kq=m.kpis.find(function(x){return x.id===b.dataset.id;});if(!kq)return;
      if(!confirm('Remove BPs from "'+kq.name+'" in '+mlabel(k)+'? BP numbers will no longer count in the house total.'))return;
      kq.bp=false;save();monthView(k);toast('BPs removed from '+kq.name);
    }else if(b.dataset.act==='del'){
      var i=m.kpis.findIndex(function(x){return x.id===b.dataset.id;});if(i<0)return;
      if(!confirm('Delete "'+m.kpis[i].name+'" from '+mlabel(k)+'? Other months keep it.'))return;
      m.kpis.splice(i,1);save();monthView(k);toast('KPI deleted from '+mlabel(k));
    }
  };
}

function kpiView(k,id){
  var m=data.months[k];if(!m){location.hash='#/home';return;}
  var kp=m.kpis.find(function(x){return x.id===id;});if(!kp){location.hash='#/month/'+k;return;}
  if(kp.scope==='house'){houseKpiView(k,kp);return;}
  top(kp.name,'#/month/'+k,mlabel(k)+(kp.bp?' · RSO + BP':' · RSO-wise'));
  var mode=getSort();
  function tbl(g,tid){
    return '<table class="rso"><thead><tr><th>'+gLbl(g)+'</th><th>Target</th><th>Achievement</th><th>Gap</th><th>Achievement %</th><th>MTD (30 days)</th></tr></thead><tbody id="'+tid+'" data-g="'+g+'"></tbody></table>';
  }
  view.innerHTML='<div id="sum"></div>'+
  '<section class="card tablecard"><div class="sec-h"><h3>RSO-wise Performance</h3><div class="seg" id="seg">'+
  [['default','Serial'],['pctDesc','Top %'],['pctAsc','Low %'],['gapDesc','Big Gap']].map(function(o){return '<button data-s="'+o[0]+'" class="'+(mode===o[0]?'on':'')+'">'+o[1]+'</button>';}).join('')+
  '</div></div>'+tbl('rso','tb')+'</section>'+
  (kp.bp?'<section class="card tablecard mt"><div class="sec-h"><h3>BP-wise Performance</h3><span class="muted" style="font-size:12.5px">Adds to the house total</span></div>'+tbl('bp','tbb')+'</section>'
        :'<div class="actions mt edonly"><button class="btn-o" id="addBp"><i>'+I.plus+'</i>Add BP targets for '+esc(kp.name)+'</button></div>')+
  '<div class="actions mt">'+shareBtn('Send '+esc(kp.name)+' report')+'<button class="btn-o" data-go="#/trend/'+k+'/'+kp.id+'"><i>'+I.kpi+'</i>Trend chart</button><button class="btn-o" id="ren"><i>'+I.edit+'</i>Rename KPI</button></div>';
  drawKpiSummary(k,kp);drawKpiRows(k,kp);
  $('#seg').onclick=function(e){var b=e.target.closest('button');if(!b)return;setSort(b.dataset.s);
    Array.prototype.forEach.call($('#seg').children,function(x){x.classList.toggle('on',x===b);});drawKpiRows(k,kp);};
  ['#tb','#tbb'].forEach(function(sel){
    var tb=$(sel);if(!tb)return;
    tb.addEventListener('input',function(e){
      var inp=e.target,tr=inp.closest('tr');if(!tr||!inp.dataset.f)return;
      var rid=tr.dataset.r;var row=kp.rows[rid]||(kp.rows[rid]={t:0,a:0});
      row[inp.dataset.f]=num(inp.value);save();
      var c=calc(row.t,row.a);tr.querySelector('.gap').innerHTML=gapHtml(c.gap);tr.querySelector('.pc').innerHTML=pctHtml(c.pct);tr.querySelector('.mtdc').innerHTML=mtdHtml(c.t,c.a,k);
      drawKpiSummary(k,kp);
    });
    tb.addEventListener('change',function(){if((getSort())!=='default')drawKpiRows(k,kp);});
  });
  if($('#addBp'))$('#addBp').onclick=function(){kp.bp=true;save();kpiView(k,id);toast('BP section added to '+kp.name);};
  $('#share').onclick=function(){shareMenu({title:kp.name+' · '+mlabel(k),text:kpiText(k,kp),tables:kpiTables(k,kp)});};
  $('#ren').onclick=function(){formSheet('Rename KPI',[{label:'KPI name',value:kp.name}],'Save',function(v){
    if(!v[0])return 'Enter a KPI name.';
    if(m.kpis.some(function(x){return x!==kp&&x.name.toLowerCase()===v[0].toLowerCase();}))return 'Another KPI already has this name.';
    kp.name=v[0];save();kpiView(k,id);toast('KPI renamed');});};
}

function drawRowsG(k,kp,g,sel){
  if(!$(sel))return;
  var mode=getSort();
  var rows=grp(g).map(function(r,i){var x=rowOf(kp,r.id),c=calc(x.t,x.a);c.r=r;c.i=i;return c;});
  if(mode==='pctDesc')rows.sort(function(a,b){return (b.pct==null?-1:b.pct)-(a.pct==null?-1:a.pct);});
  else if(mode==='pctAsc')rows.sort(function(a,b){return (a.pct==null?1e12:a.pct)-(b.pct==null?1e12:b.pct);});
  else if(mode==='gapDesc')rows.sort(function(a,b){return b.gap-a.gap;});
  $(sel).innerHTML=rows.length?rows.map(function(x,n){
    return '<tr data-r="'+x.r.id+'"><td class="c-name" data-label="'+gLbl(g)+'"><div class="namec"><span class="rank'+(mode==='pctDesc'&&n===0&&x.pct!=null?' r1':'')+'">'+(n+1)+'</span>'+
      '<button class="nlink" data-go="#/rso/'+x.r.id+'/'+k+'"><b>'+esc(x.r.name)+'</b><small>'+gLbl(g)+' '+(x.i+1)+' · view profile</small></button></div></td>'+
      '<td data-label="Target"><input class="cell n" data-f="t" type="number" inputmode="decimal" min="0" step="any" value="'+x.t+'" aria-label="Target for '+esc(x.r.name)+'"></td>'+
      '<td data-label="Achievement"><input class="cell n" data-f="a" type="number" inputmode="decimal" min="0" step="any" value="'+x.a+'" aria-label="Achievement for '+esc(x.r.name)+'"></td>'+
      '<td class="gap" data-label="Gap">'+gapHtml(x.gap)+'</td><td class="pc" data-label="Achievement %">'+pctHtml(x.pct)+'</td>'+
      '<td class="mtdc" data-label="MTD (30 days)">'+mtdHtml(x.t,x.a,k)+'</td></tr>';
  }).join(''):'<tr><td colspan="6"><div class="empty">No '+gLbl(g)+'s yet. Add them in FF Details.</div></td></tr>';
}

function loadScript(url,g){
  return new Promise(function(res,rej){
    if(window[g])return res(window[g]);
    var s=document.createElement('script');s.src=url;
    s.onload=function(){window[g]?res(window[g]):rej(new Error('Could not start the reader.'));};
    s.onerror=function(){rej(new Error('Could not download the file reader. Check your internet and try again.'));};
    document.head.appendChild(s);
  });
}
function normH(h){return String(h==null?'':h).replace(/\s+/g,' ').trim().toLowerCase();}
function cellNum(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  var s=String(v).replace(/[,৳\s]/g,'').replace(/^tk/i,'');
  if(!/^-?\d+(\.\d+)?%?$/.test(s))return null;
  var n=parseFloat(s);return isFinite(n)?n:null;
}
function normKey(v){
  var s=String(v==null?'':v).trim(),d=s.replace(/\D/g,'');
  if(d.length>=9&&d.length>=s.replace(/[\s+\-]/g,'').length-1)return 'p'+d.slice(-10);
  return 's'+s.toLowerCase();
}
function colName(i){var s='';i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}

var KPRE=[

  {k:'FWA Router',t:/^fwa( router)? (target|tgt)$/,a:/^fwa( router)? (count|ach|achievement|achv)$/},
  {k:'A.SSO',t:/^a?\.?sso$|^a\.?sso (target|tgt)$/,a:/^a\.?sso (count|ach)/},
  {k:'A.LSO',t:/^a?\.?lso$|^a\.?lso (target|tgt)$/,a:/^a\.?lso (count|ach)/},
  {k:'Recharge',t:/^total recharge target/,a:/^total rech\w*$/},

function detectPairs(hdr,orig){
  var out=[],seen={};
  KPRE.forEach(function(p){
    if(seen[p.k.toLowerCase()])return;
    var okA=function(h){return h.indexOf('%')<0&&p.a.test(h);};
    var t=hdr.findIndex(function(h){return p.t.test(h);}),a=-1,i;
    if(t<0){
      if(!p.achOnly)return;
      a=hdr.findIndex(okA);if(a<0)return;
      out.push({k:p.k,t:-1,a:a});seen[p.k.toLowerCase()]=1;seen['#'+a]=1;return;
    }
    for(i=t+1;i<hdr.length;i++){if(okA(hdr[i])){a=i;break;}}
    if(a<0)a=hdr.findIndex(okA);
    if(a<0&&!p.tOnly&&/count|ach/.test(hdr[t+1]||'')&&(hdr[t+1]||'').indexOf('%')<0)a=t+1;
    if(a<0&&!p.tOnly)return;
    out.push({k:p.k,t:t,a:a});seen[p.k.toLowerCase()]=1;seen['#'+t]=1;seen['#'+a]=1;
  });
  hdr.forEach(function(h,i){
    var m=h.match(/^(.+?)\s*[-_ ]?\s*(target|tgt)$/);if(!m)return;
    var x=m[1].trim();if(!x||seen[x.toLowerCase()]||seen['#'+i])return;
    var a=hdr.findIndex(function(g){return g===x+' ach'||g===x+' achievement'||g===x+' achv'||g===x+' achieved'||g===x+' actual'||g===x+' count'||g===x+'-ach'||g===x+'_ach';});
    if(a<0)return;
    var nm=String(orig[i]).replace(/\s+/g,' ').trim().replace(/\s*[-_ ]?\s*(target|tgt)$/i,'');
    out.push({k:nm,t:i,a:a});seen[x.toLowerCase()]=1;
  });

}
function headerRowOf(rows){

}

function pickCol(hdr,list,res,skip){

      if(list.length&&filled>=Math.max(1,list.length/2))return i;

function scoreSheet(job,sn,g,cfg){
  var rows=job.sheets[sn]||[];if(!rows.length)return -999;
  var hdr=(rows[cfg.hr]||[]).map(normH),n=jobRowsCfg(job,cfg).length,R=grp(g).length||5;
  var bpish=/\bbp\b|^bp/i.test(sn)||hdr.some(function(h){return /designation|promoter|^bp$|bp name/.test(h);});
  var s=(cfg.filterCol>=0?50:0)+Math.min(cfg.maps.length,4)*10+(cfg.maps.some(function(m){return m.on;})?20:0)+(n>=1?20:-60);
  if((data.importCfg||{})[sheetSig(sn,hdr,g)])s+=150;
  if(g==='house'){
    if(/^\s*(rso|bp)\s*$/i.test(sn)||bpish)return -999;
    s+=(/^\s*dd\s*$/i.test(sn)?60:0)+(n===1?60:-300)+Math.min(cfg.maps.length,8)*5;
    return s;
  }
  if(g==='rso'){
    s+=(/^\s*rso\s*$/i.test(sn)?30:0)+(n>=2?10:0)+(n>=R-3&&n<=R+6?60:0)+(/msisdn|i.?top|rs[o0]/.test(hdr[cfg.keyCol]||'')?30:0);

}
function autoPart(job,g,exclude){

  });

}

function autoMatch(x,g){

  var nk0=normKey(x.key);

    var r=list.find(function(r){var d=String(r.itop||'').replace(/\D/g,'');return d.length>=9&&d.slice(-10)===nk0.slice(1);});
    if(r)return {id:r.id,how:'number'};

  var r2=list.find(function(r){var n=String(r.name||'').trim().toLowerCase();if(n.length<3||/^(bp|rso) ?\d+$/.test(n))return false;return new RegExp('\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(s);});

function matchPart(job,P){

function rowsFromText(text){
  var lines=String(text||'').split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean),out=[],mx=0;
  lines.forEach(function(l){
    var toks=l.split(/\s+/),nums=[],words=[];
    toks.forEach(function(t){var n=cellNum(t.replace(/[|]/g,''));if(n!=null)nums.push(n);else if(t.replace(/[|_\-—]/g,''))words.push(t);});
    if(!nums.length)return;
    mx=Math.max(mx,nums.length);out.push([words.join(' ')||'(no text)'].concat(nums));
  });
  var hdr=['Text'];for(var i=1;i<=mx;i++)hdr.push('Number '+i);
  return [hdr].concat(out);
}
function detectDay(sheets){
  var found=0;
  Object.keys(sheets).some(function(sn){
    var rows=sheets[sn]||[];
    for(var i=0;i<Math.min(rows.length,40);i++){
      var r=rows[i]||[];
      for(var c=0;c<Math.min(r.length,12);c++){
        if(typeof r[c]==='string'&&/^\s*(days? )?passed\s*$/i.test(r[c])){var n=cellNum(r[c+1]);if(n>=1&&n<=31){found=Math.round(n);return true;}}
      }
    }
    return false;
  });
  return found;
}

function nextJob(){
  IMP.ji++;

function commitJob(job){
  var M=data.months[IMP.month],names=[];
  data.rsoKeys=data.rsoKeys||{};data.importCfg=data.importCfg||{};
  if(IMP.month===curKey()&&IMP.day)M.mtdDay=IMP.day;
  jobParts(job).forEach(function(P){
    if(!P.cfg)return;
    P.cfg.maps.forEach(function(m,mi){
      if(!m.on)return;
      var kp=findKpiIn(M,m.kpi),isNew=false,bpOn=false;
      var scp=P.g==='house'?'house':'ff';
      if(!kp){
        kp={id:uid(),name:m.kpi,rows:{},bp:P.g==='bp',scope:scp};M.kpis.push(kp);isNew=true;
        Object.keys(data.months).filter(function(x){return x>IMP.month;}).forEach(function(x){if(!findKpiIn(data.months[x],m.kpi))data.months[x].kpis.push({id:uid(),name:m.kpi,rows:{},bp:P.g==='bp',scope:scp});});
      }
      if(P.g==='house'&&kp.scope!=='house')kp.useHouse=true;
      if(P.g!=='house'&&kp.scope==='house'){kp.scope='ff';kp.useHouse=true;}
      if(P.g==='bp'&&!kp.bp){kp.bp=true;bpOn=!isNew;}
      var E=P.edit[mi],n=0;
      grp(P.g).forEach(function(r){var e=E[r.id];if(!e||(!e.file&&!e.touched))return;kp.rows[r.id]={t:num(e.t),a:num(e.a)};n++;});
      var s=partSum(kp,P.g);IMP.done.push({kpi:kp.name,g:gLbl(P.g),n:n,mtd:mtd(s.t,s.a,IMP.month).pct,isNew:isNew,bpOn:bpOn});
      if(names.indexOf(kp.name)<0)names.push(kp.name);
    });
    if(P.g==='house'&&P.cfg.hs&&P.rows[0]){
      var hr0=P.rows[0].r,cv=function(i){var v=cellNum(hr0[i]);if(v==null)return null;return Math.abs(v)<5?v*100:v;};
      M.hstats=M.hstats||{};
      if(P.cfg.hs.g!=null&&cv(P.cfg.hs.g)!=null)M.hstats.c2cGrowth=Math.round(cv(P.cfg.hs.g)*100)/100;
      if(P.cfg.hs.p!=null&&cv(P.cfg.hs.p)!=null)M.hstats.c2sGap=Math.round(cv(P.cfg.hs.p)*100)/100;
    }
    P.rows.forEach(function(x){
      if(!x.rid||P.g==='house')return;
      data.rsoKeys[normKey(x.key)]=x.rid;
      if(x.lab)data.rsoKeys[normKey(x.lab)]=x.rid;
      var nk=normKey(x.key),mb=memberById(x.rid);if(!mb)return;
      if(P.saveItop&&nk.charAt(0)==='p'&&!String(mb.m.itop||'').trim())mb.m.itop='0'+nk.slice(1);
      if(P.useNames&&x.nm&&/^(bp|rso) ?\d+$/i.test(String(mb.m.name).trim()))mb.m.name=x.nm;
    });
    if(!job.ocr){
      var hdr=(job.sheets[P.cfg.sheet][P.cfg.hr]||[]).map(normH);
      var keep={};Object.keys(data.importCfg).slice(-11).forEach(function(k){keep[k]=data.importCfg[k];});
      keep[sheetSig(P.cfg.sheet,hdr,P.g)]=JSON.parse(JSON.stringify(P.cfg));data.importCfg=keep;
      var fh=normH(((job.sheets[P.cfg.sheet]||[])[P.cfg.hr]||[])[P.cfg.filterCol]);
      if(P.cfg.filterCol>=0&&/dd|d_code|distributor/.test(fh)&&P.cfg.filterVal)data.ddCode=P.cfg.filterVal;
    }
  });
  snapNow(IMP.month,IMP.month===curKey()?(IMP.day||mtdDay(IMP.month)):30);
  data.lastImport={at:Date.now(),by:(USER&&USER.email)||'',file:job.name,kpis:names.join(', '),month:IMP.month};
  data.sampleNotice=false;
  save();
  toast('Saved '+names.join(', '));
}

function monthEnd(m){var p=m.split('-');return m+'-'+String(new Date(+p[0],+p[1],0).getDate()).padStart(2,'0');}
function slabTxt(sl){return (sl||[]).map(function(x){return x[0]+':'+x[1];}).join(', ');}
function parseSlabs(t){
  var out=[];String(t||'').split(/[,;\n]+/).forEach(function(p){var m=p.trim().match(/^(-?\d+(?:\.\d+)?)\s*[:=]\s*(-?\d+(?:\.\d+)?)$/);if(m)out.push([parseFloat(m[1]),parseFloat(m[2])]);});
  return out.sort(function(a,b){return a[0]-b[0];});
}
function slabPay(pct,sl,plus){
  if(pct==null)return 0;var p=Math.round(pct),pay=0,top=null;
  (sl||[]).forEach(function(x){if(p>=x[0]){pay=x[1];top=x;}});
  if(plus&&top&&p>100&&top[0]>=100)pay=Math.min(plus.cap,top[1]+plus.step*(p-100));
  return pay;
}
function nextSlab(pct,sl){var p=Math.round(pct||0);for(var i=0;i<(sl||[]).length;i++){if(p<sl[i][0])return sl[i];}return null;}
function campNeeds(month,g){
  var out={};(data.campaigns||[]).forEach(function(c){
    if(c.month!==month)return;
    var gs=c.kind==='weekly'?(c.groups||[]):[c.who];
    var add=function(n){if(n)out[String(n).toLowerCase()]=1;};
    if(c.kind==='weekly'){if(gs.indexOf(g)>=0||g==='house')add(c.wk&&c.wk.link);return;}
    (c.kpis||[]).forEach(function(q){
      if(c.who==='house'&&g==='house'){add(q.link);if(q.links){add(q.links.c2c);add(q.links.sc);}}
      if(c.who!=='house'&&g===c.who){add(q.link);}
    });

}
function campsFor(month,g){

    .sort(function(a,b){return (a.kind==='monthly'?0:1)-(b.kind==='monthly'?0:1)||String(a.start).localeCompare(b.start);});
}
function campState(c){
  var today=new Date();today.setHours(0,0,0,0);
  var s=new Date(c.start+'T00:00:00'),e=new Date(c.end+'T00:00:00');
  if(today<s)return {st:'soon',lbl:'Starts '+s.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
  if(today>e)return {st:'done',lbl:'Ended'};
  var left=Math.round((e-today)/86400000)+1;return {st:'live',lbl:left+' day'+(left===1?'':'s')+' left'};
}
function dmy(d){return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});}

/* ---- values for a member ('house' or member id) ---- */
function kpiVal(M,name,mid,mode,k){
  var kp=findKpiIn(M,name);if(!kp)return null;
  var x;
  if(mid==='house')x=kpiSum(kp);else{var r=kp.rows[mid];if(!r)return {t:0,a:0,pct:null,miss:true,kp:kp};x=calc(r.t,r.a);}
  var t=num(x.t),a=num(x.a);
  if(mode==='proj'){var d=mtdDay(k);a=d?a/d*30:a;}
  return {t:t,a:a,pct:t>0?a/t*100:null,kp:kp,miss:!(t>0)};
}
function campKpi(c,q,M,mid,mode,k){
  var r={pay:0,pct:null,miss:false,info:''};
  if(q.type==='gap'){
    var hs=Object.assign({},M.hstats||{},c.hs||{});
    if(hs.c2cGrowth==null||hs.c2sGap==null){r.miss=true;r.info='Needs C2C growth and C2C–C2S gap';return r;}
    var g=hs.c2cGrowth,p=hs.c2sGap;
    r.pay=g>=0?(p>=0?100:p>=-1?70:p>=-2?50:0):0;
    r.info='Growth '+g.toFixed(1)+'% · Gap '+p.toFixed(1)+'%';r.pct=null;r.gap=true;
    return r;
  }
  if(q.type==='recharge'){
    var cv=kpiVal(M,q.links.c2c,mid,mode,k),sv=kpiVal(M,q.links.sc,mid,mode,k);
    if(!cv||!sv||cv.miss||sv.miss){r.miss=true;r.info='Needs '+q.links.c2c+' and '+q.links.sc+' (house)';return r;}
    var sA=Math.min(sv.a,sv.t*(q.scCap||120)/100),tot=(cv.a+sA)/(cv.t+sv.t)*100;
    r.pct=tot;r.pay=slabPay(tot,q.slabs,q.plus);r.t=cv.t+sv.t;r.a=cv.a+sA;
    var first=(q.slabs[0]||[0])[0];
    if(Math.round(tot)<first&&q.split){
      var pc=slabPay(cv.pct,q.slabs,q.plus),ps=slabPay(Math.min(sv.pct,q.scCap||120),q.slabs,q.plus);
      r.splitE=(pc*q.split.c2c+ps*q.split.sc)/100;
      r.info='Below '+first+'%: C2C '+pctTxt(cv.pct)+' and SC '+pctTxt(sv.pct)+' counted separately';
    }
    return r;
  }
  var v=kpiVal(M,q.link,mid,mode,k);
  if(!v){r.miss=true;r.info='No “'+q.link+'” KPI yet';return r;}
  if(v.miss){r.miss=true;r.info='No '+q.link+' target';return r;}
  r.pct=v.pct;r.t=v.t;r.a=v.a;r.pay=slabPay(v.pct,q.slabs,q.plus);
  if(!(v.a>0))r.info='Achievement is 0 — not in the imported file?';
  var ns=nextSlab(v.pct,q.slabs);if(ns)r.next={at:ns[0],pay:ns[1],need:Math.max(0,Math.ceil(v.t*ns[0]/100-v.a))};
  return r;
}
function minFactor(c,q,M,mid){
  var f=100;(c.minT||[]).forEach(function(mt){
    if(!q.link||String(mt.link).toLowerCase()!==String(q.link).toLowerCase())return;
    var v=kpiVal(M,mt.link,mid,'now');var t=v?v.t:0,fx=0;
    mt.rules.forEach(function(x){if(t>=x[0])fx=x[1];});f=fx;
  });
  return f;
}
function campCalc(c,mid,mode){
  var k=c.month,M=data.months[k];if(!M)return null;
  var rows=[],total=0,miss=0;
  c.kpis.forEach(function(q){
    var r=campKpi(c,q,M,mid,mode,k);
    var earned=r.splitE!=null?r.splitE:q.weight*r.pay/100;
    if(c.who!=='house'){var f=minFactor(c,q,M,mid);if(f<100){earned=earned*f/100;r.minF=f;}}
    if(q.pen){var pn=num((c.pen||{})[mid]);if(pn){earned=earned*(1-pn/100);r.penP=pn;}}
    if(q.type==='recharge'&&c.who==='house'&&c.scr!=null){var sd=num(c.scr);var ded=sd>=20?0:sd>=15?10:15;if(ded){earned=earned*(1-ded/100);r.scrD=ded;}}
    if(r.miss)miss++;
    total+=earned;rows.push({q:q,r:r,earned:earned});
  });
  var amt=null,base=null,cat=null;
  if(c.amount&&c.amount.type==='pctSales'){
    var cv=kpiVal(M,'C2C','house',mode,k),sv=kpiVal(M,'SC Primary','house',mode,k);
    if(cv&&sv){base=(cv.a+sv.a)*num(c.amount.pct)/100;amt=base*total/100;}
  }else if(c.amount&&c.amount.type==='category'){
    var ps=(c.amount.links||[]).map(function(l){var v=kpiVal(M,l,mid,mode,k);return v&&v.pct!=null?Math.round(v.pct):0;});
    var low=ps.length?Math.min.apply(null,ps):0;
    cat=c.amount.cats.find(function(x){return low>=x[1];})||c.amount.cats[c.amount.cats.length-1];
    base=cat?cat[2]:0;amt=base*total/100;
  }else if(c.amount&&c.amount.type==='fixed'){base=num(c.amount.value);amt=base*total/100;}
  return {rows:rows,total:total,base:base,amt:amt,cat:cat,miss:miss};
}

function snapVal(M,day,name,mid){var S=M&&M.snaps&&M.snaps[day];if(!S)return null;var o=S[name]||S[Object.keys(S).find(function(n){return n.toLowerCase()===String(name).toLowerCase();})];if(!o)return null;var v=mid==='house'?o._h:o[mid];return v==null?0:num(v);}
function wkBaseDay(c){return parseInt(c.start.slice(8),10)-1;}
function wkBase(c,mid){
  var M=data.months[c.month],bd=wkBaseDay(c);
  if(c.wk.base&&c.wk.base[mid]!=null)return {v:num(c.wk.base[mid]),src:'manual'};
  if(bd<=0)return {v:0,src:'start'};
  var sv=snapVal(M,bd,c.wk.link,mid);if(sv!=null)return {v:sv,src:'snap'};
  return null;
}
function wkNow(c,mid){
  var M=data.months[c.month];if(!M)return null;
  var kp=findKpiIn(M,c.wk.link);if(!kp)return null;
  var ed=parseInt(c.end.slice(8),10),cur=mtdDay(c.month);
  var a;
  if(cur>ed){var se=snapVal(M,ed,c.wk.link,mid);a=se!=null?se:(mid==='house'?kpiSum(kp).a:num((kp.rows[mid]||{}).a));}
  else a=mid==='house'?kpiSum(kp).a:num((kp.rows[mid]||{}).a);
  return a;
}
function wkCalc(c,g,mid){
  var b=wkBase(c,mid),now=wkNow(c,mid),t=num((c.wk.tg||{})[mid]);
  if(now==null)return {miss:'No “'+c.wk.link+'” KPI'};
  if(!b)return {needBase:true,t:t};
  var a=Math.max(0,now-b.v),p=t>0?a/t*100:null,rew=0,rs=(c.wk.rew||{})[g]||[];
  rs.forEach(function(x){if(p!=null&&Math.round(p)>=x[0])rew=x[1];});
  var ns=null;for(var i=0;i<rs.length;i++){if(p==null||Math.round(p)<rs[i][0]){ns=rs[i];break;}}
  return {a:a,t:t,p:p,rew:rew,src:b.src,next:ns&&t>0?{at:ns[0],tk:ns[1],need:Math.max(0,Math.ceil(t*ns[0]/100-a))}:null};
}
function campMoney(c,mode){
  if(c.kind==='weekly'){var s=0;(c.groups||[]).forEach(function(g){grp(g).forEach(function(m){var w=wkCalc(c,g,m.id);if(w&&w.rew)s+=w.rew;});});return s;}
  if(c.who==='house'){var r=campCalc(c,'house',mode);return r?r.amt:null;}
  var t=0;grp(c.who).forEach(function(m){var r=campCalc(c,m.id,mode);if(r&&r.amt)t+=r.amt;});return t;
}

function drawReport(title,sub,tables,opt){

  var FONT='-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Helvetica Neue",Arial,sans-serif';
  var fs=27,rh=58;
  function measure(){
    var h=196;

      ctx.font='600 '+fs+'px '+FONT;
      var cw=t.head.map(function(h,i){var w=ctx.measureText(String(h)).width;t.rows.forEach(function(r){ctx.font=(i===0?'600 ':'400 ')+fs+'px '+FONT;w=Math.max(w,ctx.measureText(cellTxt(r[i])).width);});return w+30;});
      var sum=cw.reduce(function(a,b){return a+b;},0),avail=W-pad*2;
      if(sum>avail){var extra=sum-avail;cw[0]=Math.max(160,cw[0]-extra);sum=cw.reduce(function(a,b){return a+b;},0);if(sum>avail){var f=avail/sum;cw=cw.map(function(w){return w*f;});}}
      else{cw[0]+=avail-sum;}

  var H=measure();

    ctx.fillStyle='#6b7385';ctx.font='700 '+(fs-4)+'px '+FONT;x=pad;

    y+=rh;
    t.rows.forEach(function(r,ri){
      var last=t.total&&ri===t.rows.length-1;

      if(last){ctx.fillStyle='#fff2ea';ctx.fillRect(pad,y,W-pad*2,rh);}
      x=pad;
      r.forEach(function(v,i){
        var txt=cellTxt(v),col='#1b2232';
        if((t.pct||[]).indexOf(i)>=0&&typeof v==='string'&&/%$/.test(v)){var n=parseFloat(v);col=n>=90?'#16a34a':n>=70?'#c27a00':'#dc2626';}

  return cv;
}
function fitText(ctx,t,w){t=String(t);if(ctx.measureText(t).width<=w)return t;while(t.length>1&&ctx.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…';}

    [x0,Math.round((x0+x1)/2),x1].forEach(function(d){g+='<text x="'+sx(d)+'" y="'+(H-6)+'" class="ct" text-anchor="middle">'+d+'</text>';});
  }

function svgBars(pts,opt){
  opt=opt||{};var W=340,H=150,L=44,R=12,T=12,B=24,x0=1,x1=30;
  var ymax=Math.max.apply(null,pts.map(function(p){return p.y;}).concat([opt.ref||0,1]))*1.1;
  var sx=function(x){return L+(x-x0)/(x1-x0)*(W-L-R);},sy=function(y){return T+(1-y/ymax)*(H-T-B);};
  var bw=Math.max(4,(W-L-R)/30-3),g='';

function resizePhoto(file,size){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var s=Math.min(img.width,img.height),cv=document.createElement('canvas');cv.width=size;cv.height=size;
        cv.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
        res(cv.toDataURL('image/jpeg',0.72));
      };
      img.onerror=function(){rej(new Error('This picture could not be opened.'));};
      img.src=fr.result;
    };
    fr.onerror=function(){rej(new Error('Could not read the picture.'));};
    fr.readAsDataURL(file);
  });
}

    view.onclick=function(e){
      var b=e.target.closest('[data-l]');if(!b)return;
      var row=b.closest('[data-t]'),t=row.dataset.t,l=links.find(function(x){return x._id===t;});if(!l)return;
      var a=b.dataset.l,url=linkUrl(t);
      if(a==='wa')openWA('Hello '+l.name+'! 👋\nHere is your view-only link to *ETIS / KHUCHU04* — Emon\'s territory dashboard (KPI, towers, RSO performance).\nNo password needed, just tap:\n'+url);
      else if(a==='copy')copyText(url);
      else if(a==='off'||a==='on'){
        b.disabled=true;
        FB.updateDoc(FB.doc(FB.db,'viewers',t),{active:a==='on'}).then(function(){toast(a==='on'?'Link turned on':'Link turned off — it no longer opens the app');linksView();},function(){b.disabled=false;toast('Could not update. Check internet.');});
      }else if(a==='del'){
        if(!confirm('Delete the link for "'+l.name+'"? It will stop working. Activity history stays.'))return;
        FB.deleteDoc(FB.doc(FB.db,'viewers',t)).then(function(){toast('Link deleted');linksView();},function(){toast('Could not delete. Check internet.');});
      }
    };
  },function(e){view.innerHTML='<div class="empty">Could not load links ('+esc((e&&e.code)||'error')+'). Check that the new Firebase rules are published.</div>';});
}
var actFilter='all';
function activityView(){
  if(!OWNER){location.hash='#/home';return;}
  top('Viewer Activity','#/settings','Who opened what, and when');
  view.innerHTML=loadingHtml('Loading activity…');
  fetchActivity().then(function(act){
    if(location.hash!=='#/activity')return;
    function draw(){
      var names={};act.forEach(function(a){names[a.token]=a.name||'Viewer';});
      var list=actFilter==='all'?act:act.filter(function(a){return a.token===actFilter;});
      var t0=new Date();t0.setHours(0,0,0,0);var wk=Date.now()-7*86400000;
      var today=list.filter(function(a){return a.atMs>=t0.getTime();}).length;
      var week=list.filter(function(a){return a.atMs>=wk;});
      var who={};week.forEach(function(a){who[a.token]=1;});
      var per={};list.forEach(function(a){var p=per[a.token]||(per[a.token]={name:a.name||'Viewer',n:0,last:0,dev:'',pages:{}});p.n++;if(a.atMs>p.last){p.last=a.atMs;p.dev=a.dev||'';}var sec=String(a.page||'').split(' · ')[0];p.pages[sec]=(p.pages[sec]||0)+1;});
      var people=Object.keys(per).map(function(k){per[k].t=k;return per[k];}).sort(function(a,b){return b.last-a.last;});
      var html='<div class="sec-h"><select class="msel" id="af" aria-label="Filter by viewer"><option value="all">All viewers</option>'+
        Object.keys(names).map(function(k){return '<option value="'+esc(k)+'"'+(k===actFilter?' selected':'')+'>'+esc(names[k])+'</option>';}).join('')+
        '</select><button class="btn-s" id="aref"><i>'+I.gps+'</i>Refresh</button></div>'+
        '<div class="stats"><div class="stat" style="--c:var(--brand)"><small>Views today</small><b>'+today+'</b><em>Page opens</em></div>'+
        '<div class="stat" style="--c:var(--blue)"><small>Last 7 days</small><b>'+week.length+'</b><em>Page opens</em></div>'+
        '<div class="stat" style="--c:var(--good)"><small>Viewers (7 days)</small><b>'+Object.keys(who).length+'</b><em>Different people</em></div>'+
        '<div class="stat" style="--c:var(--warn)"><small>Last view</small><b style="font-size:17px">'+(list[0]?ago(list[0].atMs):'—')+'</b><em>'+(list[0]?esc(list[0].name||''):'No views yet')+'</em></div></div>';
      if(!list.length){html+='<div class="empty">No views yet. When someone opens their viewer link, every page they open shows up here.</div>';view.innerHTML=html;bind();return;}
      html+='<div class="sec-title">By person</div><section class="card">'+people.map(function(p){
        var top3=Object.keys(p.pages).sort(function(a,b){return p.pages[b]-p.pages[a];}).slice(0,3);
        return '<div class="trow" role="button" tabindex="0" data-af="'+esc(p.t)+'"><div class="tn"><b>'+esc(p.name)+'</b><small>Last seen '+ago(p.last)+(p.dev?' · '+esc(p.dev):'')+'</small>'+
          '<div class="chips" style="margin-top:6px">'+top3.map(function(x){return '<span class="pgchip">'+esc(x)+' ×'+p.pages[x]+'</span>';}).join('')+'</div></div>'+
          '<div class="tr">'+p.n+'<small>views</small></div></div>';
      }).join('')+'</section>';
      html+='<div class="sec-title">Timeline <span style="text-transform:none;letter-spacing:0;font-weight:600">latest '+Math.min(list.length,300)+'</span></div><section class="card">';
      var lastDay='';
      list.slice(0,300).forEach(function(a){
        var dl=dayLbl(a.atMs);if(dl!==lastDay){html+='<div class="aday">'+dl+'</div>';lastDay=dl;}
        html+='<div class="arow"><span class="t">'+hhmm(a.atMs)+'</span><div><b>'+esc(a.name||'Viewer')+'</b> <span class="muted" style="font-size:13.5px">opened</span> '+esc(a.page||'—')+'<small>'+esc(a.dev||'')+'</small></div></div>';
      });
      html+='</section>';
      view.innerHTML=html;bind();
    }
    function bind(){
      $('#af').onchange=function(){actFilter=this.value;draw();};
      $('#aref').onclick=activityView;
      view.onclick=function(e){var r=e.target.closest('[data-af]');if(r){actFilter=r.dataset.af;draw();window.scrollTo(0,0);}};
    }
    draw();
  },function(e){view.innerHTML='<div class="empty">Could not load activity ('+esc((e&&e.code)||'error')+'). Check that the new Firebase rules are published.</div>';});
}

/* page-view logging for viewer links */
function pageLabel(p){
  var mm=function(k){return data.months[k]?mlabel(k):'';};
  switch(p[0]){
    case 'summary':return 'Overall KPI Summary · '+mlabel(data.months[p[1]]?p[1]:curKey());
    case 'month':return 'Monthly KPI · '+mm(p[1]);
    case 'kpi':var M=data.months[p[1]],kp=M&&M.kpis.find(function(x){return x.id===p[2];});return 'KPI · '+(kp?kp.name:'?')+' · '+mm(p[1]);
    case 'towers':return 'Tower list';
    case 'tower':var t=data.towers.find(function(x){return x.id===p[1];});return 'BTS · '+(t?t.name:'?');
    case 'ff':return 'FF Details';
    case 'person':return 'FF · '+((data.people[p[1]]||{}).title||p[1]);
    case 'rsos':return 'RSO list';
    case 'bps':return 'BP list';
    case 'rso':var mb=memberById(p[1]);return (mb?gLbl(mb.g):'RSO')+' · '+(mb?mb.m.name:'?');
    case 'total':return 'KHUCHU04 In Total';
    case 'camp':return 'Campaigns';
    case 'brief':return 'Morning briefing';
    case 'trend':return 'Trend chart';
    case 'report':return 'Month-end report';
    case 'campg':return 'Campaigns · '+(p[1]==='house'?'Distributor':gLbl(p[1]));
    case 'campall':return 'All campaigns';
    case 'campx':var cc=(data.campaigns||[]).find(function(x){return x.id===p[1];});return 'Campaign · '+(cc?cc.name:'?');
    case 'settings':return 'Settings';
    default:return 'Home';
  }
}
function devName(){
  var u=navigator.userAgent;
  var os=/Android/.test(u)?'Android':/iPhone|iPad/.test(u)?'iPhone':/Windows/.test(u)?'Windows':/Mac OS/.test(u)?'Mac':'Other';
  var br=/Edg\//.test(u)?'Edge':/SamsungBrowser/.test(u)?'Samsung':/Chrome\//.test(u)?'Chrome':/Firefox/.test(u)?'Firefox':/Safari/.test(u)?'Safari':'Browser';
  return os+' · '+br;
}
function logView(p){
  if(!VIEWER||!READY||!USER)return;
  var label=pageLabel(p),now=Date.now();
  if(lastLog.p===label&&now-lastLog.t<20000)return;
  lastLog={p:label,t:now};
  FB.addDoc(FB.collection('activity'),{uid:USER.uid,token:TOKEN,name:VIEWER.name,page:label,path:location.hash||'#/home',dev:devName(),atMs:now,at:FB.serverTimestamp()}).catch(function(){});
}
function showGate(spin,title,text){
  $('#login').classList.add('hidden');$('#shell').classList.add('hidden');$('#gate').classList.remove('hidden');
  $('#gateBody').innerHTML=(spin?'<div class="spin"></div>':'')+'<h2>'+esc(title)+'</h2><p>'+esc(text)+'</p>';
}

function busy(){
  var a=document.activeElement;
  return !$('#sheet').classList.contains('hidden')||(a&&view.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName));
}
function softRender(){
  if(busy()){deferRender=true;return;}
  deferRender=false;var y=window.scrollY;render();window.scrollTo(0,y);
}
function lockInputs(){view.querySelectorAll('input,textarea').forEach(function(i){if(i.type!=='file'&&i.id!=='rt')i.readOnly=true;});}
function showLogin(){
  $('#gate').classList.add('hidden');$('#shell').classList.add('hidden');$('#login').classList.remove('hidden');
  var local=MODE==='local',load=MODE==='loading';
  $('#luL').textContent=local?'Username':'Email';
  $('#lu').type=local?'text':'email';
  $('#lu').placeholder=local?'Enter username':'you@example.com';
  $('#demo').classList.toggle('hidden',!(local&&data.auth.user==='admin'&&data.auth.pass==='123456'));
  $('#forgot').classList.toggle('hidden',MODE!=='cloud');
  var b=$('#lbtn');b.disabled=load;b.textContent=load?'Connecting…':'Login';
  $('#lmode').textContent=load?'Connecting to cloud…':local?'⚠️ Offline mode — cloud not reachable. Data stays on this device only.':'☁️ Live sync on — use the email and password from Firebase.';
}
function render(){
  closeSheet();
  view.onclick=null;view.oninput=null;view.onchange=null;
  $('#gate').classList.add('hidden');
  if(BLOCKED){
    if(BLOCKED==='off')showGate(false,'This link is turned off','Ask Emon to send you a new link.');
    else showGate(false,'Could not open the link',BLOCKED);
    return;
  }
  if(TOKEN&&MODE!=='local'&&(!USER||USER.isAnonymous)&&!READY){showGate(true,'Opening ETIS…','Loading Emon\'s territory dashboard');return;}
  if(MODE==='loading'||(MODE==='cloud'&&!USER)||(MODE==='local'&&store.get(AUTH)!=='1')){showLogin();return;}
  $('#login').classList.add('hidden');$('#shell').classList.remove('hidden');
  if(MODE==='cloud'&&!READY){
    top('ETIS','','Loading data…');
    view.innerHTML='<div class="loading"><div class="spin"></div>Loading territory data from the cloud…</div>';return;
  }
  document.body.classList.toggle('ro',RO);
  document.body.classList.toggle('viewer',!!VIEWER);
  ensureMonth();ensureCampaigns();
  var p=location.hash.replace(/^#\/?/,'').split('/').map(function(s){try{return decodeURIComponent(s);}catch(e){return s;}});
  switch(p[0]){
    case 'summary':summaryView(p[1]);break;
    case 'month':monthView(p[1]);break;
    case 'kpi':kpiView(p[1],p[2]);break;
    case 'towers':towersView();break;
    case 'tower':towerView(p[1]);break;
    case 'ff':ffView();break;
    case 'person':personView(p[1]);break;
    case 'rsos':rsosView();break;
    case 'bps':bpsView();break;
    case 'rso':rsoView(p[1],p[2]);break;
    case 'total':totalView();break;
    case 'settings':settingsView();break;
    case 'links':linksView();break;
    case 'activity':activityView();break;
    case 'import':importView();break;
    case 'camp':campHome();break;
    case 'brief':briefView();break;
    case 'trend':trendView(p[1],p[2]);break;
    case 'report':reportView();break;
    case 'campg':campGroup(p[1]);break;
    case 'campall':campAll();break;
    case 'campx':campDetail(p[1],p[2]);break;
    case 'campe':campEdit(p[1],p[2]);break;
    default:home();
  }
  if(RO)lockInputs();
  logView(p);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
document.addEventListener('click',function(e){
  var w=e.target.closest('[data-wa]');if(w){e.preventDefault();openWA('',w.dataset.wa);return;}
  var g=e.target.closest('[data-go]');
  if(g&&!e.target.closest('input,select,textarea,a,label,[data-act],[data-delf]')){location.hash=g.dataset.go;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('[role=button][data-go]'))location.hash=e.target.dataset.go;
  if(e.key==='Escape')closeSheet();
});
view.addEventListener('focusout',function(){
  setTimeout(function(){
    if(busy())return;
    if(pendingRemote){var r=pendingRemote;pendingRemote=null;applyRemote(r.j,r.by);}
    else if(deferRender)softRender();
  },250);
});

/* ---------- auth messages ---------- */
function authMsg(e){
  var c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Wrong email or password. Try again.';
  if(/invalid-email/.test(c))return 'That email address does not look right.';
  if(/too-many-requests/.test(c))return 'Too many tries. Wait a few minutes, then try again.';
  if(/network-request-failed/.test(c))return 'No internet connection. Check your data or Wi-Fi.';
  if(/user-disabled/.test(c))return 'This account has been disabled.';
  if(/weak-password/.test(c))return 'New password is too weak. Use at least 6 characters.';
  if(/requires-recent-login/.test(c))return 'Please log out and log in again, then change the password.';
  return 'Something went wrong ('+(c||'unknown')+'). Try again.';
}
function loginErr(m,good){
  var el=$('#lerr');el.textContent=m;el.style.color=good?'var(--good)':'';
  if(!good){var c=$('#loginForm');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}
}

/* ---------- cloud sync ---------- */
function applyRemote(j,by){
  if(j===lastJson)return;
  var nd;try{nd=JSON.parse(j);}catch(e){return;}
  if(!valid(nd))return;
  lastJson=j;data=fix(nd);store.set(KEY,j);
  if(by&&USER&&by!==USER.email)toast('Updated by '+by.split('@')[0]);
  softRender();
}
function onRemote(j,by){
  if(pushT)return;                     /* my unsent change wins */
  if(busy()){pendingRemote={j:j,by:by};return;}
  applyRemote(j,by);
}
function checkRole(){
  var t=new Promise(function(res){setTimeout(function(){res('timeout');},7000);});
  var w=FB.setDoc(FB.doc(FB.db,'meta','ping_'+USER.uid),{by:USER.email||'',at:FB.serverTimestamp()})
    .then(function(){return 'ok';},function(e){return (e&&e.code)||'err';});
  return Promise.race([w,t]).then(function(r){
    RO=(r==='permission-denied');
    if(r==='ok')setSync('● Live','live');else if(RO)setSync('View only','ro');else setSync('Offline','off');
  });
}
function stopListeners(){if(unsub){unsub();unsub=null;}if(unsubV){unsubV();unsubV=null;}}
function snapExists(sn){return typeof sn.exists==='function'?sn.exists():!!sn.exists;}
function startData(after){
  var first=true;
  unsub=FB.onSnapshot(FB.doc(FB.db,'etis','main'),function(snap){
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    var exists=snapExists(snap);
    if(!exists){CLOUD_EMPTY=true;}
    else{
      CLOUD_EMPTY=false;var d=snap.data()||{};
      if(first){
        var nd;try{nd=JSON.parse(d.json);}catch(e){}
        if(valid(nd)){lastJson=d.json;data=fix(nd);store.set(KEY,d.json);}
      }else onRemote(d.json,d.by);
    }
    if(first){first=false;after().then(function(){READY=true;render();});}
    else if(!exists&&READY)softRender();
  },function(err){
    if(BLOCKED)return;
    if(VIEWER&&err&&err.code==='permission-denied'){BLOCKED='off';stopListeners();render();return;}
    toast('Cloud error: '+((err&&err.code)||'unknown'));
    if(first){first=false;READY=true;setSync('Offline','off');render();}
  });
}
function checkOwner(){
  return FB.getDoc(FB.doc(FB.db,'meta','ownercheck')).then(function(){OWNER=true;},function(){OWNER=false;});
}
function enterViewer(u){
  FB.getDoc(FB.doc(FB.db,'viewers',TOKEN)).then(function(sn){
    var d=snapExists(sn)?sn.data():null;
    if(!d||!d.active){BLOCKED='off';try{localStorage.removeItem('etis_vtoken');}catch(e){}render();return;}
    VIEWER={name:d.name||'Viewer'};
    return FB.setDoc(FB.doc(FB.db,'sessions',u.uid),{token:TOKEN,name:VIEWER.name,dev:devName(),atMs:Date.now(),at:FB.serverTimestamp()}).then(function(){
      store.set('etis_vtoken',TOKEN);RO=true;CLOUD_EMPTY=false;setSync('View only','ro');
      unsubV=FB.onSnapshot(FB.doc(FB.db,'viewers',TOKEN),function(s2){
        var d2=snapExists(s2)?s2.data():null;
        if(!d2||!d2.active){BLOCKED='off';stopListeners();try{localStorage.removeItem('etis_vtoken');}catch(e){}render();}
      },function(){});
      startData(function(){return Promise.resolve();});
    });
  }).catch(function(e){
    BLOCKED=(e&&e.code==='permission-denied')?'off':'Check your internet connection and open the link again.';render();
  });
}
function bootCloud(){
  MODE='cloud';
  FB.onAuth(function(u){
    stopListeners();
    USER=u;READY=false;RO=false;CLOUD_EMPTY=false;pendingRemote=null;VIEWER=null;OWNER=false;
    document.body.classList.remove('ro','viewer');
    if(!u){
      setSync('','');
      if(TOKEN&&!BLOCKED){
        render();
        FB.signInAnon().catch(function(e){
          BLOCKED=(e&&/admin-restricted|operation-not-allowed/.test(e.code||''))
            ?'Viewer links are not switched on yet. Ask Emon to enable them in Firebase.'
            :'Check your internet connection and open the link again.';
          render();
        });
        return;
      }
      render();return;
    }
    if(u.isAnonymous){
      if(!TOKEN){FB.signOut();return;}
      render();enterViewer(u);return;
    }
    /* email user: editor or owner */
    BLOCKED='';
    if(URLTOKEN)toast('You are logged in as editor. To test a viewer link, open it in an incognito window.');
    TOKEN='';try{localStorage.removeItem('etis_vtoken');}catch(e){}
    render();
    startData(function(){return Promise.all([checkRole(),checkOwner()]);});
  });
}
function bootFB(){
  if(FBDONE)return;FBDONE=true;clearTimeout(fbTimer);
  if(window.ETIS_FB){FB=window.ETIS_FB;bootCloud();}
  else{MODE='local';render();}
}

$('#loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  var u=$('#lu').value.trim(),pw=$('#lp').value;
  if(MODE==='loading')return;
  if(MODE==='cloud'){
    if(!u||!pw){loginErr('Enter your email and password.');return;}
    var b=$('#lbtn');b.disabled=true;b.textContent='Logging in…';
    FB.signIn(u,pw).then(function(){$('#lp').value='';$('#lerr').textContent='';if(location.hash!=='#/home')location.hash='#/home';},
      function(er){loginErr(authMsg(er));}).then(function(){b.disabled=false;b.textContent='Login';});
    return;
  }
  if(u===data.auth.user&&pw===data.auth.pass){
    store.set(AUTH,'1');$('#lerr').textContent='';$('#lp').value='';
    if(location.hash!=='#/home')location.hash='#/home';else render();
  }else loginErr('Wrong username or password. Try again.');
});
$('#forgot').onclick=function(){
  var u=$('#lu').value.trim();
  if(!u){loginErr('Type your email above first, then tap “Forgot password?”.');return;}
  FB.reset(u).then(function(){loginErr('Password reset email sent to '+u+'. Check your inbox and spam folder.',true);},function(er){loginErr(authMsg(er));});
};
$('#eye').onclick=function(){var i=$('#lp');i.type=i.type==='password'?'text':'password';};
$('#setBtn').onclick=function(){location.hash='#/settings';};
$('#tbHome').onclick=function(){location.hash='#/home';};
$('#logoutBtn').onclick=function(){
  if(!confirm('Log out of ETIS?'))return;
  if(MODE==='cloud'){if(pushT)push();FB.signOut();location.hash='#/home';return;}
  store.del(AUTH);$('#lu').value='';location.hash='#/login';render();
};

var fbTimer=null;
render();
if(window.ETIS_FB||window.ETIS_FB_FAIL)bootFB();
else{
  window.addEventListener('etis-fb',bootFB);
  fbTimer=setTimeout(function(){if(!FBDONE){FBDONE=true;MODE='local';render();toast('Cloud not reachable — offline mode');}},15000);
}
})();
</script>
